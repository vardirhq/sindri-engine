[package]
name = "sindri-mobile"
description = "The native half of Sindri Mobile: a project and its scene, drawn by the engine, behind a JNI bridge for the Android app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Depends on the independently versioned Weave workspace through sindri-runtime.
publish = false

# `cdylib` is the `libsindri_mobile.so` the Android app loads; `rlib` is what
# the tests reach. On a desktop target only the platform-neutral part builds.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
glam.workspace = true
serde_json.workspace = true
sindri-assets = { path = "../../crates/sindri-assets" }
sindri-core = { path = "../../crates/sindri-core" }
sindri-gpu = { path = "../../crates/sindri-gpu" }
sindri-render = { path = "../../crates/sindri-render" }
sindri-runtime = { path = "../../crates/sindri-runtime" }
sindri-scene = { path = "../../crates/sindri-scene" }
wgpu.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
ndk = { version = "0.9", default-features = false, features = ["nativewindow", "rwh_06"] }
pollster.workspace = true
raw-window-handle = "0.6.2"

# The workspace's lints, except that unsafe code is denied rather than
# forbidden. The JNI bridge cannot exist without it: every function Java calls
# must be exported unmangled, and an Android `Surface` becomes a native window
# only through an unsafe NDK call. `deny` lets those few items carry an
# `#[allow(unsafe_code)]` with the reason beside it; everything else in the
# crate is held to the workspace rule. See `mobile/first-slice.md`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dev-dependencies]
pollster.workspace = true
