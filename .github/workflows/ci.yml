      - name: Capture job failure
        id: failure
        if: ${{ failure() || steps.browser_artifact.outcome == 'failure' }}
        shell: bash
        run: |
          failed_step=""
          [[ "${{ steps.browser_tooling.outcome }}" == "failure" ]] && failed_step="Install browser tooling"
          [[ "${{ steps.browser_build.outcome }}" == "failure" ]] && failed_step="Build the browser bundles"
          [[ "${{ steps.browser_export.outcome }}" == "failure" ]] && failed_step="Export the browser projects"
          [[ "${{ steps.browser_smoke.outcome }}" == "failure" ]] && failed_step="Smoke the rendered games"
          [[ "${{ steps.browser_failures.outcome }}" == "failure" ]] && failed_step="Smoke the startup failure paths"
          if [[ -n "$failed_step" ]]; then
            {
              echo "Run the engine in a browser"
              echo "failed: $failed_step"
            } | cargo run --quiet --package sindri-diagnostics --bin sindri-diagnostics -- \
              check-result >failure.json || true
          elif [[ "${{ steps.browser_artifact.outcome }}" == "failure" ]]; then
            {
              echo "Run the engine in a browser"
              echo "HTTP 403 while finalizing browser-captures artifact"
            } | cargo run --quiet --package sindri-diagnostics --bin sindri-diagnostics -- \
              check-result >failure.json || true
          fi
          if [[ -s failure.json ]]; then
            echo "failure=$(cat failure.json)" >>"$GITHUB_OUTPUT"
          fi
          if [[ "${{ steps.browser_artifact.outcome }}" == "failure" ]]; then
            echo "::error::Browser captures were produced, but GitHub rejected artifact finalization with HTTP 403."
            exit 1
          fi

  # What a game-only pull request runs in place of the workspace tests: the
  # game's own suite, which holds the rules, the bot's whole crossings and the
  # screen layouts.
  game_tests:
    name: Game tests
    needs: scope
    if: ${{ needs.scope.outputs.light == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/linux-deps
        with:
          packages: libasound2-dev libudev-dev libvulkan1 libxkbcommon-x11-0 mesa-vulkan-drivers
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143
      - name: Test the game
        env:
          WGPU_BACKEND: vulkan
          SINDRI_REQUIRE_GPU: 1
          SINDRI_REQUIRE_GPU_TIMESTAMPS: 1
        run: cargo nextest run --package sindri-causeway --all-features --no-fail-fast

  # The record the reuse job looks for: an artifact named after the tree this
  # run tested, left only when every job passed. Runs from forks never leave
  # one, and the reuse job would not trust one from a fork anyway.
  record:
    name: Record the verified tree
    needs: [reuse, scope, quick, decay_preflight, baker, clippy, test, wasm, browser, game_tests]
    if: >-
      ${{ !cancelled() && needs.reuse.outputs.verified != 'true'
      && needs.quick.result == 'success' && needs.decay_preflight.result == 'success'
      && needs.baker.result == 'success' && needs.clippy.result == 'success'
      && needs.test.result == 'success' && needs.wasm.result == 'success'
      && needs.browser.result == 'success' && needs.scope.outputs.light != 'true'
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Name the tested tree
        id: tree
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "tree=$tree" >>"$GITHUB_OUTPUT"
          printf '%s\n' "$tree" "$GITHUB_SHA" "$GITHUB_EVENT_NAME" >verified.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ci-verified-${{ steps.tree.outputs.tree }}
          path: verified.txt
          retention-days: 30

  diagnostics_summary:
    name: CI failure summary
    if: ${{ always() && (needs.quick.result == 'failure' || needs.decay_preflight.result == 'failure' || needs.clippy.result == 'failure' || needs.test.result == 'failure' || needs.wasm.result == 'failure' || needs.browser.result == 'failure' || needs.game_tests.result == 'failure') }}
    needs: [quick, decay_preflight, clippy, test, wasm, browser, game_tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Correlate structured failures
        env:
          QUICK_FAILURE: ${{ needs.quick.outputs.failure }}
          DECAY_FAILURE: ${{ needs.decay_preflight.outputs.failure }}
          CLIPPY_FAILURE: ${{ needs.clippy.outputs.failure }}
          TEST_FAILURE: ${{ needs.test.outputs.failure }}
          WASM_FAILURE: ${{ needs.wasm.outputs.failure }}
          BROWSER_FAILURE: ${{ needs.browser.outputs.failure }}
        shell: bash
        run: |
          failures=()
          [[ -n "$QUICK_FAILURE" ]] && failures+=("$QUICK_FAILURE")
          [[ -n "$DECAY_FAILURE" ]] && failures+=("$DECAY_FAILURE")
          [[ -n "$CLIPPY_FAILURE" ]] && failures+=("$CLIPPY_FAILURE")
          [[ -n "$TEST_FAILURE" ]] && failures+=("$TEST_FAILURE")
          [[ -n "$WASM_FAILURE" ]] && failures+=("$WASM_FAILURE")
          [[ -n "$BROWSER_FAILURE" ]] && failures+=("$BROWSER_FAILURE")
          if [[ ${#failures[@]} -eq 0 ]]; then
            echo "A watched CI job failed before a structured fingerprint could be emitted." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s\n' "${failures[@]}" | jq -s '.' | \
            cargo run --quiet --package sindri-diagnostics --bin sindri-diagnostics -- correlate \
            >>"$GITHUB_STEP_SUMMARY"
