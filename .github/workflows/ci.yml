name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The autofix workflow starts CI this way on the commit it pushes, because a
  # push made with the workflow's own token starts no workflows by itself.
  workflow_dispatch:
  # A merge queue tests the exact commit main is about to become. The push to
  # main that follows then finds that commit's tree already verified (see the
  # reuse job) and skips everything.
  merge_group:

permissions:
  contents: read

# A branch under review is pushed to several times in a row, and every push
# used to start a fourteen-minute run that nobody was waiting for by the time
# it finished. Superseded pull request runs are cancelled; main is not, because
# each commit there is the only record of whether that commit was green.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Incremental compilation caches state for a rebuild that never happens: each
  # job compiles once and exits. It only inflates the target directory, which is
  # then paid for again in cache upload and download time.
  CARGO_INCREMENTAL: 0
  # Nothing here debugs a CI binary interactively, and full debuginfo is the
  # largest single contributor to both link time and cache size. Line tables
  # keep panic backtraces pointing at real source lines, which is what a failing
  # check is actually read for.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # A pull request's run tests the merge of its head into main, and a merge
  # queue's run tests the commit main becomes. When either was green and main
  # did not move before the merge, the commit pushed to main has the same tree
  # -- the same bytes in every file, this workflow included -- and running the
  # same checks over it again can only repeat their answer. That repeat was a
  # full second run of every job for every merge. `scripts/ci_reuse.py` looks
  # for the verified record the record job below leaves, and only in runs from
  # this repository. A push that changes a dependency manifest always runs in
  # full, because main's run is what saves the build cache pull requests
  # restore from.
  reuse:
    name: Reuse a verified result
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      verified: ${{ steps.lookup.outputs.verified }}
    steps:
      - uses: actions/checkout@v7
      - name: Look for a green run of this tree
        id: lookup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          changed="$RUNNER_TEMP/changed"
          # The pushed range, not only its last commit: a rebase merge pushes
          # several. A diff needs only the two trees, so one more shallow
          # commit is enough. Without the previous head there is no range, and
          # the run goes in full.
          if [[ "$BEFORE" =~ ^0+$ ]] || ! git fetch --quiet --no-tags --depth=1 origin "$BEFORE"; then
            echo Cargo.toml >"$changed"
          else
            git diff --name-only "$BEFORE" HEAD >"$changed"
          fi
          python3 scripts/ci_reuse.py ci --repo "$GITHUB_REPOSITORY" \
            --repo-id "$GITHUB_REPOSITORY_ID" --tree "$(git rev-parse 'HEAD^{tree}')" \
            --changed "$changed"

  # A pull request that only touches the companion game -- its scripts,
  # assets, tests and the generators that write them -- cannot change what the
  # engine, the editor or the browser host do, so it does not pay for the
  # engine's whole workspace test run, the render captures or the browser run
  # (about half an hour on a software GPU). It runs the game's own tests
  # instead. Anything else in the diff, or any event other than a pull request,
  # runs everything. The push to main after the merge is the full check: a
  # light run leaves no verified record, so nothing there is skipped.
  scope:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      light: ${{ steps.scope.outputs.light }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Is the diff only the game
        id: scope
        shell: bash
        run: |
          light=false
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            # The checkout is the merge of the head into main, so HEAD^ is the
            # whole pull request's diff.
            light=true
            while IFS= read -r file; do
              case "$file" in
                game/assets/*|game/tests/*|game/sindri.toml|CHANGELOG.md) ;;
                tools/causeway_art.py|tools/level.py|tools/check_causeway_art.py) ;;
                docs/capabilities/projects.md|docs/capabilities/projects.toml) ;;
                *) light=false; echo "Full run: $file"; break ;;
              esac
            done < <(git diff --name-only HEAD^ HEAD)
          fi
          echo "light=$light" >>"$GITHUB_OUTPUT"
          echo "Game-only pull request: $light" >>"$GITHUB_STEP_SUMMARY"

  # Nothing here compiles anything, so it reports in well under a minute. It
  # used to gate every compiling job, which saved their runners when a missing
  # newline was going to fail the run anyway, but it also hid every Clippy and
  # test failure behind that newline until the next push. An agent that cannot
  # run the checks itself then found one class of failure per round trip. The
  # compiling jobs now run regardless, so one run reports everything, and the
  # autofix workflow repairs formatting on its own.
  quick:
    name: Format and file sizes
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    outputs:
      failure: ${{ steps.rustfmt.outputs.failure }}${{ steps.file_size.outputs.failure }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - name: Check formatting with structured diagnostics
        id: rustfmt
        shell: bash
        run: |
          output="$(mktemp)"
          set +e
          cargo fmt --all --check >"$output" 2>&1
          status=$?
          set -e
          if [[ $status -ne 0 ]]; then
            cat "$output"
            cargo run --quiet --package sindri-diagnostics --bin sindri-diagnostics -- \
              rustfmt --github <"$output" || true
            report="$(mktemp)"
            cargo run --quiet --package sindri-diagnostics --bin sindri-diagnostics -- \
              rustfmt --json <"$output" >"$report" || true
            {
              echo "Format and file sizes"
              cat "$report"
            } | cargo run --quiet --package sindri-diagnostics --bin sindri-diagnostics -- \
              report-check-result >failure.json || true
            rm -f "$report"
            if [[ -s failure.json ]]; then
              echo "failure=$(cat failure.json)" >>"$GITHUB_OUTPUT"
            fi
            rm -f "$output"
            exit "$status"
          fi
          rm -f "$output"
      - name: Test agent preflight discovery
        run: python3 -m unittest scripts/test_preflight.py
      - name: Test CI result reuse
        run: python3 -m unittest scripts/test_ci_reuse.py
      - name: Test site publisher verification
        run: python3 -m unittest discover -s site/tests
      - name: Check file sizes with structured diagnostics
        id: file_size
        shell: bash
        run: |
          output="$(mktemp)"
          set +e
          scripts/check-file-size.py >"$output" 2>&1
          status=$?
          set -e
          cat "$output"
          if [[ $status -ne 0 ]]; then
            cargo run --quiet --package sindri-diagnostics --bin sindri-diagnostics -- file-size --github <"$output" || true
            report="$(mktemp)"
            cargo run --quiet --package sindri-diagnostics --bin sindri-diagnostics -- \
              file-size --json <"$output" >"$report" || true
            {
              echo "Format and file sizes"
              cat "$report"
            } | cargo run --quiet --package sindri-diagnostics --bin sindri-diagnostics -- \
              report-check-result >failure.json || true
            rm -f "$report"
            if [[ -s failure.json ]]; then
              echo "failure=$(cat failure.json)" >>"$GITHUB_OUTPUT"
            fi
          fi
          rm -f "$output"
          exit "$status"

  # Compile changed gameplay scripts against the same typed Sindri host surface
  # the editor uses. Like the quick job, it no longer gates the compiling jobs,
  # so a script typo and a Rust failure are reported by the same run.
  decay_preflight:
    name: Decay project preflight
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    outputs:
      failure: ${{ steps.decay.outputs.failure }}
    steps:
      # A pull request run checks out the merge commit, whose first parent is
      # the base branch, so HEAD^ is the whole pull request's diff. A manual
      # run checks out the branch itself, where HEAD^ is only its last commit,
      # so it diffs against its merge base with main instead.
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name != 'workflow_dispatch' && 2 || 0 }}
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check changed Decay scripts
        id: decay
        shell: bash
        run: |
          base=HEAD^
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            base="$(git merge-base origin/main HEAD)"
          fi

          # decay/ is the engine-agnostic language workspace: its scripts
          # run against a test host, not Sindri, and its own tests check them.
          mapfile -t scripts < <(
            git diff --name-only --diff-filter=ACMRT "$base" HEAD -- '*.decay' \
              ':(exclude)decay/**'
          )

          if ! git diff --quiet "$base" HEAD -- tools/decay-lsp crates/sindri-decay \
            decay/crates/decay-semantic decay/crates/decay-syntax
          then
            cargo test --quiet --package decay-lsp
          fi

          if [[ ${#scripts[@]} -eq 0 ]]; then
            echo "No Decay scripts changed."
            exit 0
          fi

          output="$(mktemp)"
          set +e
          cargo run --quiet --package decay-lsp -- --check --json "${scripts[@]}" >"$output"
          status=$?
          set -e

          cat "$output"
          cargo run --quiet --package sindri-diagnostics --bin sindri-diagnostics -- decay --github <"$output" || true
          if [[ $status -ne 0 ]]; then
            report="$(mktemp)"
            cargo run --quiet --package sindri-diagnostics --bin sindri-diagnostics -- \
              decay --json <"$output" >"$report" || true
            {
              echo "Decay project preflight"
              cat "$report"
            } | cargo run --quiet --package sindri-diagnostics --bin sindri-diagnostics -- \
              report-check-result >failure.json || true
            rm -f "$report"
            if [[ -s failure.json ]]; then
              echo "failure=$(cat failure.json)" >>"$GITHUB_OUTPUT"
            fi
            {
              echo
              echo "Run locally:"
              echo
              echo '~~~bash'
              printf 'cargo run --quiet --package decay-lsp -- --check'
              printf ' %q' "${scripts[@]}"
              echo
              echo '~~~'
            } >>"$GITHUB_STEP_SUMMARY"
          fi
          rm -f "$output"
          exit "$status"

  # The isometric baker is a Node tool with no dependencies, so this is the
  # whole of its build: run its tests, then re-bake its fixture and check that
  # nothing about the result moved. A baked asset is checked into the
  # repository, and the only thing that makes that safe is a job that notices
  # when the pipeline stops producing it.
  baker:
    name: Isometric baker
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Type stripping runs .ts directly, so the tool has no build step —
          # but it needs a Node new enough to do it without a flag.
          node-version: '22.18'
      # The one install in this job is for the page, not the tool: Three.js,
      # which reads model files there. Without it the tests that read real model
      # files report themselves skipped rather than passing.
      - name: Install the page's model reader
        run: npm ci --ignore-scripts --prefix tools/isometric-baker/web
      - name: Test
        working-directory: tools/isometric-baker
        run: node --test test/*.test.ts
      - name: Check the fixture is still what its recipe bakes
        working-directory: tools/isometric-baker
        run: node src/cli.ts fixtures/project/prefabs/standing-stone.isobake --out fixtures/project --check
      # Orbital draws itself with vector shapes now; its mine blast is the one
      # baked sheet left, and a recipe that stops producing what is checked in
      # would show up as art that quietly drifts from its source.
      - name: Check the baked variant's art is still what its recipes bake
        working-directory: tools/isometric-baker
        run: |
          for recipe in ../../games/orbital-baked/assets/textures/*.isobake; do
            node src/cli.ts "$recipe" --out ../../games/orbital-baked/assets --check
          done

      # Causeway's models, textures, scene and prefabs are generated by two
      # scripts; only the textures need Pillow. Art drifting from its source
      # would show up as an island that no longer matches the heights its
      # rules read.
      - name: Check Causeway's art and scene are still what their scripts make
        run: |
          python3 -m pip install --disable-pip-version-check 'pillow==12.3.0'
          python3 tools/causeway_art.py
          python3 tools/level.py
          python3 tools/check_causeway_art.py

  clippy:
    name: Clippy
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    outputs:
      failure: ${{ steps.clippy.outputs.failure }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Pull request runs restore the cache main wrote and do not write one
          # of their own. Every branch saving its own copy of a target directory
          # this size evicts the entries the next run was going to restore, so
          # the caching made runs slower rather than faster.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Clippy compiles the native dependency graph, so ALSA — which Rodio's
      # CPAL backend links on Linux — has to be present before it runs.
      - uses: ./.github/actions/linux-deps
        with:
          packages: libasound2-dev libudev-dev
      - name: Clippy with structured diagnostics
        id: clippy
        shell: bash
        run: |
          output="$(mktemp)"
          set +e
          # --keep-going: a crate that fails to compile would otherwise stop
          # Clippy before it reached the crates after it, hiding their lints
          # until the next push.
          cargo clippy --workspace --all-targets --all-features --keep-going \
            --message-format=json >"$output"
          status=$?
          set -e

          if [[ $status -ne 0 ]]; then
            cargo run --quiet --package sindri-diagnostics --bin sindri-diagnostics -- \
              cargo --github <"$output" || true
            report="$(mktemp)"
            cargo run --quiet --package sindri-diagnostics --bin sindri-diagnostics -- \
              cargo --json <"$output" >"$report" || true
            {
              echo "Clippy"
              cat "$report"
            } | cargo run --quiet --package sindri-diagnostics --bin sindri-diagnostics -- \
              report-check-result >failure.json || true
            rm -f "$report"
            if [[ -s failure.json ]]; then
              echo "failure=$(cat failure.json)" >>"$GITHUB_OUTPUT"
            fi
          fi
          rm -f "$output"
          exit "$status"

  test:
    name: Test and render captures
    needs: [reuse, scope]
    if: ${{ !cancelled() && needs.reuse.outputs.verified != 'true' && needs.scope.outputs.light != 'true' }}
    runs-on: ubuntu-latest
    # Both jobs take 20 to 25 minutes, so at 25 a slow runner was cancelled
    # partway through, with nothing failed.
    timeout-minutes: 40
    outputs:
      failure: ${{ steps.failure.outputs.failure }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # SINDRI_REQUIRE_GPU makes a missing adapter fail the GPU tests rather
      # than skip them on the one machine installed to run them, so the software
      # Vulkan stack has to be here before the tests are.
      - uses: ./.github/actions/linux-deps
        with:
          packages: imagemagick libasound2-dev libudev-dev libvulkan1 libxkbcommon-x11-0 mesa-vulkan-drivers xdotool xvfb
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143
      # `cargo test` runs one test binary at a time, so the workspace's slowest
      # suite was serialised behind everything else however idle the runner
      # was. nextest runs every test in one pool across all binaries, which
      # turns the total into roughly the slowest single test rather than the
      # sum of the slowest per binary.
      # Building and running are separate steps so the run's timing says which
      # of the two the wait is, and the build's `--timings` report (uploaded
      # below) says which crates and test binaries the build time goes to.
      - name: Build the tests
        id: test_build
        run: cargo nextest run --workspace --all-features --no-run --timings
      - name: Test
        id: native_tests
        env:
          WGPU_BACKEND: vulkan
          SINDRI_REQUIRE_GPU: 1
          SINDRI_REQUIRE_GPU_TIMESTAMPS: 1
        # nextest stops at the first failing test by default, which reports
        # one failure per push. Every failure is wanted from the same run.
        run: cargo nextest run --workspace --all-features --no-fail-fast
      - name: Upload the test build's timings
        if: ${{ !cancelled() && steps.test_build.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-build-timings
          path: target/cargo-timings/cargo-timing.html
          if-no-files-found: warn
          retention-days: 14
      # nextest does not run doctests -- it has no way to, they are compiled
      # and run by rustdoc rather than built into a test binary. Left out, the
      # switch above would have quietly dropped every example in the public
      # API's documentation from CI, so they are run here instead.
      - name: Test the documented examples
        id: doctests
        run: cargo test --workspace --all-features --doc --no-fail-fast
      # The captures stay in this job rather than a parallel one of their own:
      # they run the same crates the tests just built, and a separate job would
      # spend longer recompiling them than the captures take.
      #
      # The editor is built in its own step first, because `cargo run` otherwise
      # compiles inside the capture's own budget. `capture-editor.sh` waits
      # thirty seconds for a window to appear, and that had been spent waiting
      # for rustc rather than for the editor: the capture failed with "window
      # did not appear" while the editor was still being linked, which is a true
      # statement about a window and a useless one about what went wrong. It had
      # been passing with about a second to spare, so any change to what the
      # cache already holds decides it.
      #
      # One `cargo build` for the one package, matching how the script runs it.
      # Building several packages in a single invocation unifies their features,
      # which resolves differently from `cargo run --package sindri-editor` on
      # its own -- the artifacts then do not match what the run wants and it
      # compiles them again, which is the whole of what this avoids.
      - name: Build the editor the capture runs
        id: editor_build
        run: cargo build --package sindri-editor
      - name: Capture native editor runtime viewport
        id: editor_capture
        env:
          WGPU_BACKEND: vulkan
        run: |
          timeout 60s xvfb-run --auto-servernum --server-args="-screen 0 1600x1200x24" ./scripts/capture-editor.sh target/render-artifacts/editor-runtime-viewport.png
          timeout 60s xvfb-run --auto-servernum --server-args="-screen 0 1600x1200x24" ./scripts/capture-editor.sh target/render-artifacts/editor-tile-volume.png game/assets/tile-volume-editor.scene Blocks
      - name: Capture scene-driven frame pipeline
        id: scene_capture
        env:
          WGPU_BACKEND: vulkan
        run: |
          cargo run --package sindri-cube --bin capture -- target/render-artifacts/scene-frame-pipeline.png
          python3 scripts/browser/prepare-benchmark3d.py target/native-benchmark3d-no-shadows
          cargo run --package sindri-causeway --bin project-capture -- examples/benchmark3d target/render-artifacts/native-benchmark3d.png 960 540 wait:0.5
          cargo run --package sindri-causeway --bin project-capture -- target/native-benchmark3d-no-shadows target/render-artifacts/native-benchmark3d-no-shadows.png 960 540 wait:0.5
          node scripts/browser/compare-shadows.mjs target/render-artifacts/native-benchmark3d.png target/render-artifacts/native-benchmark3d-no-shadows.png
          python3 scripts/browser/prepare-model-receiver.py target/model-receiver
          python3 scripts/browser/prepare-model-receiver.py target/model-receiver-no-shadows --no-shadows
          cargo run --package sindri-causeway --bin project-capture -- target/model-receiver target/render-artifacts/native-model-receiver.png 960 540 wait:0.5
          cargo run --package sindri-causeway --bin project-capture -- target/model-receiver-no-shadows target/render-artifacts/native-model-receiver-no-shadows.png 960 540 wait:0.5
          node scripts/browser/compare-shadows.mjs target/render-artifacts/native-model-receiver.png target/render-artifacts/native-model-receiver-no-shadows.png --green-receiver
          python3 scripts/browser/prepare-model-receiver.py target/model-caster --model-caster
          python3 scripts/browser/prepare-model-receiver.py target/model-caster-no-shadows --model-caster --no-shadows
          cargo run --package sindri-causeway --bin project-capture -- target/model-caster target/render-artifacts/native-model-caster.png 960 540 wait:0.5
          cargo run --package sindri-causeway --bin project-capture -- target/model-caster-no-shadows target/render-artifacts/native-model-caster-no-shadows.png 960 540 wait:0.5
          node scripts/browser/compare-shadows.mjs target/render-artifacts/native-model-caster.png target/render-artifacts/native-model-caster-no-shadows.png --green-receiver
          python3 scripts/browser/prepare-standard-materials.py target/standard-materials
          python3 scripts/browser/prepare-standard-materials.py target/standard-materials-legacy --legacy
          python3 scripts/browser/prepare-imported-emission.py target/imported-emission
          python3 scripts/browser/prepare-imported-emission.py target/imported-emission-off --no-emission
          python3 scripts/browser/prepare-surface-normals.py target/surface-normals
          python3 scripts/browser/prepare-surface-normals.py target/surface-normals-flat --flat
          python3 scripts/browser/prepare-point-lights.py target/point-lights
          python3 scripts/browser/prepare-point-lights.py target/point-lights-off --off
          python3 scripts/browser/prepare-spot-lights.py target/spot-lights
          python3 scripts/browser/prepare-spot-lights.py target/spot-lights-away --away
          python3 scripts/browser/prepare-lighting3d.py target/lighting3d-off
          python3 scripts/browser/prepare-lighting3d.py target/lighting3d-single --single-sided
          python3 scripts/browser/prepare-lighting3d.py target/lighting3d-inline --inline-materials
          python3 scripts/browser/prepare-lighting3d.py target/lighting3d-green --green-materials
          cargo run --package sindri-causeway --bin project-capture -- target/standard-materials target/render-artifacts/native-standard-materials.png 960 540 wait:0.5
          cargo run --package sindri-causeway --bin project-capture -- target/standard-materials-legacy target/render-artifacts/native-standard-materials-legacy.png 960 540 wait:0.5
          node scripts/browser/compare-materials.mjs target/render-artifacts/native-standard-materials.png target/render-artifacts/native-standard-materials-legacy.png
          cargo run --package sindri-causeway --bin project-capture -- target/imported-emission target/render-artifacts/native-imported-emission.png 960 540 wait:0.5
          cargo run --package sindri-causeway --bin project-capture -- target/imported-emission-off target/render-artifacts/native-imported-emission-off.png 960 540 wait:0.5
          node scripts/browser/compare-materials.mjs target/render-artifacts/native-imported-emission.png target/render-artifacts/native-imported-emission-off.png
          cargo run --package sindri-causeway --bin project-capture -- target/surface-normals target/render-artifacts/native-surface-normals.png 960 540 wait:0.5
          cargo run --package sindri-causeway --bin project-capture -- target/surface-normals-flat target/render-artifacts/native-surface-normals-flat.png 960 540 wait:0.5
          node scripts/browser/compare-normals.mjs target/render-artifacts/native-surface-normals.png target/render-artifacts/native-surface-normals-flat.png
          cargo run --package sindri-causeway --bin project-capture -- target/point-lights target/render-artifacts/native-point-lights.png 960 540 wait:0.5
          cargo run --package sindri-causeway --bin project-capture -- target/point-lights-off target/render-artifacts/native-point-lights-off.png 960 540 wait:0.5
          node scripts/browser/compare-point-lights.mjs target/render-artifacts/native-point-lights.png target/render-artifacts/native-point-lights-off.png
          cargo run --package sindri-causeway --bin project-capture -- target/spot-lights target/render-artifacts/native-spot-lights.png 960 540 wait:0.5
          cargo run --package sindri-causeway --bin project-capture -- target/spot-lights-away target/render-artifacts/native-spot-lights-away.png 960 540 wait:0.5
          node scripts/browser/compare-point-lights.mjs target/render-artifacts/native-spot-lights.png target/render-artifacts/native-spot-lights-away.png
          cargo run --package sindri-causeway --bin project-capture -- examples/lighting3d target/render-artifacts/native-lighting3d.png 960 540 wait:4
          cargo run --package sindri-causeway --bin project-capture -- target/lighting3d-single target/render-artifacts/native-lighting3d-single.png 960 540 wait:4
          node scripts/browser/compare-sidedness.mjs target/render-artifacts/native-lighting3d.png target/render-artifacts/native-lighting3d-single.png
          cargo run --package sindri-causeway --bin project-capture -- target/lighting3d-inline target/render-artifacts/native-lighting3d-inline.png 960 540 wait:4
          cmp target/render-artifacts/native-lighting3d.png target/render-artifacts/native-lighting3d-inline.png
          cargo run --package sindri-causeway --bin project-capture -- target/lighting3d-green target/render-artifacts/native-lighting3d-green.png 960 540 wait:4
          node scripts/browser/compare-material-profiles.mjs target/render-artifacts/native-lighting3d.png target/render-artifacts/native-lighting3d-green.png
          cargo run --package sindri-causeway --bin project-capture -- target/lighting3d-off target/render-artifacts/native-lighting3d-off.png 960 540 wait:4
          node scripts/browser/compare-point-lights.mjs target/render-artifacts/native-lighting3d.png target/render-artifacts/native-lighting3d-off.png
          cargo run --package sindri-causeway --bin project-capture -- examples/lighting3d target/render-artifacts/native-lighting3d-point-phase.png 960 540 wait:0
          cargo run --package sindri-causeway --bin project-capture -- examples/lighting3d target/render-artifacts/native-lighting3d-spot-phase.png 960 540 wait:0.6
          node scripts/browser/compare-light-phases.mjs target/render-artifacts/native-lighting3d-point-phase.png target/render-artifacts/native-lighting3d-spot-phase.png
          for daynight_phase in sunrise:0 midday:2.2 sunset:4.7 night:6.2; do
            cargo run --package sindri-causeway --bin project-capture -- examples/daynight target/render-artifacts/native-daynight-${daynight_phase%:*}.png 960 540 wait:${daynight_phase#*:}
          done
          node scripts/browser/compare-daynight.mjs cycle target/render-artifacts/native-daynight-{sunrise,midday,sunset,night}.png
          for daynight_hour in 10 14; do
            python3 scripts/browser/prepare-daynight.py target/daynight-$daynight_hour --hour $daynight_hour --stationary
            python3 scripts/browser/prepare-daynight.py target/daynight-$daynight_hour-off --hour $daynight_hour --stationary --no-shadows
            cargo run --package sindri-causeway --bin project-capture -- target/daynight-$daynight_hour target/render-artifacts/native-daynight-$daynight_hour.png 960 540 wait:0
            cargo run --package sindri-causeway --bin project-capture -- target/daynight-$daynight_hour-off target/render-artifacts/native-daynight-$daynight_hour-off.png 960 540 wait:0
          done
          node scripts/browser/compare-daynight.mjs shadows target/render-artifacts/native-daynight-{10,10-off,14,14-off}.png
          python3 scripts/browser/prepare-daynight.py target/daynight-night --hour 0 --stationary
          python3 scripts/browser/prepare-daynight.py target/daynight-night-off --hour 0 --stationary --no-night
          cargo run --package sindri-causeway --bin project-capture -- target/daynight-night target/render-artifacts/native-daynight-lights.png 960 540 wait:0
          cargo run --package sindri-causeway --bin project-capture -- target/daynight-night-off target/render-artifacts/native-daynight-lights-off.png 960 540 wait:0
          node scripts/browser/compare-daynight.mjs night target/render-artifacts/native-daynight-lights{,-off}.png
          cargo run --package sindri-causeway --bin project-benchmark -- examples/benchmark3d target/render-artifacts/benchmark3d.json 3 30
          cargo run --package sindri-causeway --bin project-benchmark -- target/native-benchmark3d-no-shadows target/render-artifacts/benchmark3d-no-shadows.json 3 30
          python3 scripts/check-3d-benchmark.py target/render-artifacts/benchmark3d.json target/render-artifacts/benchmark3d-no-shadows.json --require-gpu-timing
          timeout 120s xvfb-run --auto-servernum --server-args="-screen 0 1600x1200x24" target/debug/sindri-editor examples/benchmark3d --benchmark target/render-artifacts/editor-benchmark3d.json --frames 3 --settle 30
          timeout 120s xvfb-run --auto-servernum --server-args="-screen 0 1600x1200x24" target/debug/sindri-editor target/native-benchmark3d-no-shadows --benchmark target/render-artifacts/editor-benchmark3d-no-shadows.json --frames 3 --settle 30
          python3 scripts/check-3d-benchmark.py target/render-artifacts/editor-benchmark3d.json target/render-artifacts/editor-benchmark3d-no-shadows.json --require-gpu-timing
          cargo run --package sindri-causeway --bin project-benchmark -- games/platformer target/render-artifacts/platformer-batches.json 3 30
          timeout 120s xvfb-run --auto-servernum --server-args="-screen 0 1600x1200x24" target/debug/sindri-editor games/platformer --benchmark target/render-artifacts/editor-platformer-batches.json --frames 3 --settle 30
          python3 scripts/check-platformer-batches.py target/render-artifacts/platformer-batches.json target/render-artifacts/editor-platformer-batches.json
      - name: Capture the companion game mid-run
        id: causeway_capture
        env:
          WGPU_BACKEND: vulkan
        run: cargo run --package sindri-causeway --bin causeway-capture -- target/render-artifacts/causeway.png
      - name: Capture Orbital spectacle on desktop and phone
        id: orbital_capture
        env:
          WGPU_BACKEND: vulkan
        run: |
          cargo run --package orbital-baked --bin orbital-baked-capture -- target/render-artifacts/orbital-spectacle-desktop.png 1440 900 spectacle
          cargo run --package orbital-baked --bin orbital-baked-capture -- target/render-artifacts/orbital-spectacle-phone.png 390 844 spectacle
          cargo run --package orbital-baked --bin orbital-baked-capture -- target/render-artifacts/orbital-combat-lab.png 1000 700 lab
      # Both images render the same scene, so both are held to the same colours.
      # The editor screenshot went unexamined for a release while its viewport
      # sampled through a view that decoded a second time: everything else
      # passed and only the picture was wrong.
      - name: Verify captured colours
        id: verify_captures
        run: |
          cargo run --package sindri-cube --bin verify -- target/render-artifacts/editor-runtime-viewport.png
          cargo run --package sindri-cube --bin verify -- target/render-artifacts/scene-frame-pipeline.png
      - name: Upload visual test captures
        id: visual_artifact
        uses: actions/upload-artifact@v7
        with:
          name: visual-test-captures
          path: |
            target/render-artifacts/editor-runtime-viewport.png
            target/render-artifacts/editor-tile-volume.png
            target/render-artifacts/scene-frame-pipeline.png
            target/render-artifacts/native-benchmark3d.png
            target/render-artifacts/native-model-receiver.png
            target/render-artifacts/native-model-caster.png
            target/render-artifacts/native-standard-materials.png
            target/render-artifacts/native-standard-materials-legacy.png
            target/render-artifacts/native-imported-emission.png
            target/render-artifacts/native-imported-emission-off.png
            target/render-artifacts/native-surface-normals.png
            target/render-artifacts/native-surface-normals-flat.png
            target/render-artifacts/native-point-lights.png
            target/render-artifacts/native-point-lights-off.png
            target/render-artifacts/native-spot-lights.png
            target/render-artifacts/native-spot-lights-away.png
            target/render-artifacts/native-daynight-*.png
            target/render-artifacts/native-lighting3d.png
            target/render-artifacts/native-lighting3d-single.png
            target/render-artifacts/native-lighting3d-inline.png
            target/render-artifacts/native-lighting3d-green.png
            target/render-artifacts/native-lighting3d-off.png
            target/render-artifacts/native-lighting3d-point-phase.png
            target/render-artifacts/native-lighting3d-spot-phase.png
            target/render-artifacts/native-model-caster-no-shadows.png
            target/render-artifacts/native-model-receiver-no-shadows.png
            target/render-artifacts/native-benchmark3d-no-shadows.png
            target/render-artifacts/benchmark3d.json
            target/render-artifacts/benchmark3d-no-shadows.json
            target/render-artifacts/editor-benchmark3d.json
            target/render-artifacts/editor-benchmark3d-no-shadows.json
            target/render-artifacts/platformer-batches.json
            target/render-artifacts/editor-platformer-batches.json
            target/render-artifacts/causeway.png
            target/render-artifacts/orbital-spectacle-desktop.png
            target/render-artifacts/orbital-spectacle-phone.png
            target/render-artifacts/orbital-combat-lab.png
          if-no-files-found: error
          retention-days: 14

      - name: Capture job failure
        id: failure
        if: ${{ failure() }}
        shell: bash
        run: |
          failed_step="Test and render captures"
          [[ "${{ steps.test_build.outcome }}" == "failure" ]] && failed_step="Build the tests"
          [[ "${{ steps.native_tests.outcome }}" == "failure" ]] && failed_step="Test"
          [[ "${{ steps.doctests.outcome }}" == "failure" ]] && failed_step="Test the documented examples"
          [[ "${{ steps.editor_build.outcome }}" == "failure" ]] && failed_step="Build the editor the capture runs"
          [[ "${{ steps.editor_capture.outcome }}" == "failure" ]] && failed_step="Capture native editor runtime viewport"
          [[ "${{ steps.scene_capture.outcome }}" == "failure" ]] && failed_step="Capture scene-driven frame pipeline"
          [[ "${{ steps.causeway_capture.outcome }}" == "failure" ]] && failed_step="Capture the companion game mid-run"
          [[ "${{ steps.orbital_capture.outcome }}" == "failure" ]] && failed_step="Capture Orbital spectacle on desktop and phone"
          [[ "${{ steps.verify_captures.outcome }}" == "failure" ]] && failed_step="Verify captured colours"
          [[ "${{ steps.visual_artifact.outcome }}" == "failure" ]] && failed_step="Upload visual test captures"
          {
            echo "Test and render captures"
            echo "failed: $failed_step"
          } | cargo run --quiet --package sindri-diagnostics --bin sindri-diagnostics -- \
            check-result >failure.json || true
          if [[ -s failure.json ]]; then
            echo "failure=$(cat failure.json)" >>"$GITHUB_OUTPUT"
          fi

  wasm:
    name: Browser target
    needs: [reuse, scope]
    if: ${{ !cancelled() && needs.reuse.outputs.verified != 'true' && needs.scope.outputs.light != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      failure: ${{ steps.failure.outputs.failure }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Nothing in the wasm32 graph links ALSA — Rodio is a dependency only
      # under `cfg(not(target_arch = "wasm32"))` — but this job used to share a
      # runner that had it, and twenty seconds of apt is cheaper than finding
      # out from a red build that something in the graph moved.
      - uses: ./.github/actions/linux-deps
        with:
          packages: libasound2-dev libudev-dev
      # Built from source, this took a minute and forty seconds of every run to
      # produce a binary whose version is pinned anyway. The prebuilt release is
      # the same artifact without the compile. The version still has to match
      # the wasm-bindgen the workspace resolves.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.128
      - name: Check browser workspace
        id: wasm_check
        run: cargo check --workspace --all-features --keep-going --target wasm32-unknown-unknown
      # A texture that decodes natively and not in the browser build is the
      # failure the asset system's whole promise rests on, so the decode corpus
      # is run on the browser target too, in Node through wasm-bindgen's runner.
      - name: Test image decoding in the browser build
        id: wasm_decode
        run: |
          cargo test --package sindri-assets --target wasm32-unknown-unknown \
            --test decode_compatibility

      - name: Capture job failure
        id: failure
        if: ${{ failure() }}
        shell: bash
        run: |
          failed_step="Browser target"
          [[ "${{ steps.wasm_check.outcome }}" == "failure" ]] && failed_step="Check browser workspace"
          [[ "${{ steps.wasm_decode.outcome }}" == "failure" ]] && failed_step="Test image decoding in the browser build"
          {
            echo "Browser target"
            echo "failed: $failed_step"
          } | cargo run --quiet --package sindri-diagnostics --bin sindri-diagnostics -- \
            check-result >failure.json || true
          if [[ -s failure.json ]]; then
            echo "failure=$(cat failure.json)" >>"$GITHUB_OUTPUT"
          fi

  # Compiling for wasm32 says nothing about whether the engine runs. The game
  # makes this gate stricter still: its static site includes the actual project
  # asset tree plus a manifest generated from those exact bytes, and the browser
  # must request every asset category over HTTP under a non-root base path
  # before the test accepts the rendered game. The same harness then takes away
  # the canvas and an adapter, and forces a device failure, so startup failures
  # have to be shown to a player rather than living only in a developer console.
  # The missing-WebGPU interface guard is asserted directly in the exporter's
  # page-template test because Chromium no longer lets test code reliably hide
  # its Navigator supplement. The device case is the one the page cannot check
  # for itself: it fails after `init()` has resolved, and a phone showing
  # nothing but a blank canvas is what that looked like before the engine
  # started announcing it.
  browser:
    name: Run the engine in a browser
    needs: [reuse, scope]
    if: ${{ !cancelled() && needs.reuse.outputs.verified != 'true' && needs.scope.outputs.light != 'true' }}
    runs-on: ubuntu-latest
    # Both jobs take 20 to 25 minutes, so at 25 a slow runner was cancelled
    # partway through, with nothing failed.
    timeout-minutes: 40
    outputs:
      failure: ${{ steps.failure.outputs.failure }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1
      # Chromium is launched with `--use-angle=vulkan --use-vulkan=swiftshader`,
      # so it needs the Vulkan loader on the machine. Playwright's own
      # `install-deps` does not provide it, and without it the browser still
      # reports `navigator.gpu` — `--enable-unsafe-webgpu` sees to that — and
      # then draws nothing, which reads as an engine that started and rendered
      # a blank frame rather than as a missing system library.
      - uses: ./.github/actions/linux-deps
        with:
          packages: libvulkan1 mesa-vulkan-drivers
      # Chromium and its npm tree are the same bytes on every run and are worth
      # roughly a minute of it. The system libraries the browser links are not
      # cached — `install-deps` is apt — so they are installed either way.
      - name: Cache browser tooling
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            scripts/browser/node_modules
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/browser/package.json') }}
      - name: Install browser tooling
        id: browser_tooling
        run: |
          npm install --prefix scripts/browser
          npx --prefix scripts/browser playwright install-deps chromium
          npx --prefix scripts/browser playwright install chromium
      - name: Build the browser bundles
        id: browser_build
        # `wasm-opt` makes the download smaller and was three of this job's
        # five and a half minutes; cargo's own release build takes half a
        # minute. The smoke below needs the bundle to run, not to be small, so a
        # pull request skips it. Main keeps it, so the optimised bundle the
        # site deploys is still the one proven to start.
        env:
          WASM_OPT: ${{ github.event_name == 'pull_request' && '--no-opt' || '' }}
        run: |
          wasm-pack build examples/cube --target web --out-dir pkg $WASM_OPT
          wasm-pack build crates/sindri-player --target web --out-dir pkg $WASM_OPT
      # Everything below runs against the *exported* directory rather than the
      # source tree. That is the point: what CI proves is what a deployment
      # would serve, page and manifest and hashed assets and all.
      - name: Export the browser projects
        id: browser_export
        run: |
          cargo run --quiet --package sindri-export --bin sindri-export -- \
            game target/dist/causeway --base /sindri-engine/
          cp -R crates/sindri-player/pkg/. target/dist/causeway/pkg/
          # Weave uses the same generic browser host, but adds an Other asset
          # that the host recognizes as a presentation stylesheet.
          cargo run --quiet --package sindri-export --bin sindri-export -- \
            games/weave-poc target/dist/weave --base /sindri-engine/examples/weave-poc/
          cp -R crates/sindri-player/pkg/. target/dist/weave/pkg/
          # Orbital, the one deployed to Pages that a person actually plays. It
          # is the project with prefabs -- including prefabs only another
          # prefab names -- and screens switched off until something shows
          # them, so it is the build that proves those reach a browser. Its
          # title screen is laid out by Weave rather than by its scene, and its
          # portrait rules are reached only in a browser at phone width.
          cargo run --quiet --package sindri-export --bin sindri-export -- \
            games/orbital-baked target/dist/orbital-baked --base /sindri-engine/
          cp -R crates/sindri-player/pkg/. target/dist/orbital-baked/pkg/
          cargo run --quiet --package sindri-export --bin sindri-export -- \
            examples/tween target/dist/tween --base /sindri-engine/examples/tween/
          cp -R crates/sindri-player/pkg/. target/dist/tween/pkg/
          cargo run --quiet --package sindri-export --bin sindri-export -- \
            examples/tween target/dist/tween-root --base /examples/tween/
          cp -R crates/sindri-player/pkg/. target/dist/tween-root/pkg/
          cargo run --quiet --package sindri-export --bin sindri-export -- \
            examples/camera target/dist/camera --base /sindri-engine/examples/camera/
          cp -R crates/sindri-player/pkg/. target/dist/camera/pkg/
          cargo run --quiet --package sindri-export --bin sindri-export -- \
            examples/camera target/dist/camera-root --base /examples/camera/
          cp -R crates/sindri-player/pkg/. target/dist/camera-root/pkg/
          cargo run --quiet --package sindri-export --bin sindri-export -- \
            examples/spatial target/dist/spatial --base /sindri-engine/examples/spatial/
          cp -R crates/sindri-player/pkg/. target/dist/spatial/pkg/
          cargo run --quiet --package sindri-export --bin sindri-export -- \
            examples/spatial target/dist/spatial-root --base /examples/spatial/
          cp -R crates/sindri-player/pkg/. target/dist/spatial-root/pkg/
          cargo run --quiet --package sindri-export --bin sindri-export -- \
            examples/physics target/dist/physics --base /sindri-engine/examples/physics/
          cp -R crates/sindri-player/pkg/. target/dist/physics/pkg/
          cargo run --quiet --package sindri-export --bin sindri-export -- \
            examples/physics target/dist/physics-root --base /examples/physics/
          cp -R crates/sindri-player/pkg/. target/dist/physics-root/pkg/
          cargo run --quiet --package sindri-export --bin sindri-export -- \
            examples/audio target/dist/audio --base /sindri-engine/examples/audio/
          cp -R crates/sindri-player/pkg/. target/dist/audio/pkg/
          cargo run --quiet --package sindri-export --bin sindri-export -- \
            examples/input target/dist/input --base /sindri-engine/examples/input/
          cp -R crates/sindri-player/pkg/. target/dist/input/pkg/
          cargo run --quiet --package sindri-export --bin sindri-export -- \
            examples/ui target/dist/ui --base /sindri-engine/examples/ui/
          cp -R crates/sindri-player/pkg/. target/dist/ui/pkg/
          cargo run --quiet --package sindri-export --bin sindri-export -- \
            examples/ui target/dist/ui-root --base /examples/ui/
          cp -R crates/sindri-player/pkg/. target/dist/ui-root/pkg/
          cargo run --quiet --package sindri-export --bin sindri-export -- \
            games/low-tide target/dist/low-tide --base /examples/low-tide/
          cp -R crates/sindri-player/pkg/. target/dist/low-tide/pkg/
          for project in sprite-shaders sprite-masks; do
            cargo run --quiet --package sindri-export --bin sindri-export -- \
              examples/$project target/dist/$project --base /examples/$project/
            cp -R crates/sindri-player/pkg/. target/dist/$project/pkg/
          done
          # Keep the shipped gameplay/starting pose and add read-only telemetry
          # for a real keyboard-driven run to the platformer's goal.
          # Voxel Lab with collision and a read-only observer that drops a
          # block onto its generated terrain, proving voxel collision in a
          # browser. `a_block_lands_on_voxel_lab` plays the same fixture natively.
          python3 scripts/browser/prepare-voxel-landing.py target/browser-voxel-landing
          cargo run --quiet --package sindri-export --bin sindri-export -- \
            target/browser-voxel-landing target/dist/voxel-landing --base /sindri-engine/
          cp -R crates/sindri-player/pkg/. target/dist/voxel-landing/pkg/
          python3 examples/benchmark3d/assets/generate.py --check
          cargo run --quiet --package sindri-export --bin sindri-export -- \
            examples/benchmark3d target/dist/benchmark3d --base /examples/benchmark3d/
          cp -R crates/sindri-player/pkg/. target/dist/benchmark3d/pkg/
          python3 scripts/browser/prepare-benchmark3d.py target/browser-benchmark3d-no-shadows
          cargo run --quiet --package sindri-export --bin sindri-export -- \
            target/browser-benchmark3d-no-shadows target/dist/benchmark3d-no-shadows --base /examples/benchmark3d/
          cp -R crates/sindri-player/pkg/. target/dist/benchmark3d-no-shadows/pkg/
          python3 scripts/browser/prepare-model-receiver.py target/model-receiver
          python3 scripts/browser/prepare-model-receiver.py target/model-receiver-no-shadows --no-shadows
          python3 scripts/browser/prepare-model-receiver.py target/model-caster --model-caster
          python3 scripts/browser/prepare-model-receiver.py target/model-caster-no-shadows --model-caster --no-shadows
          python3 scripts/browser/prepare-standard-materials.py target/standard-materials
          python3 scripts/browser/prepare-standard-materials.py target/standard-materials-legacy --legacy
          python3 scripts/browser/prepare-imported-emission.py target/imported-emission
          python3 scripts/browser/prepare-imported-emission.py target/imported-emission-off --no-emission
          python3 scripts/browser/prepare-surface-normals.py target/surface-normals
          python3 scripts/browser/prepare-surface-normals.py target/surface-normals-flat --flat
          python3 scripts/browser/prepare-point-lights.py target/point-lights
          python3 scripts/browser/prepare-point-lights.py target/point-lights-off --off
          python3 scripts/browser/prepare-spot-lights.py target/spot-lights
          python3 scripts/browser/prepare-spot-lights.py target/spot-lights-away --away
          python3 scripts/browser/prepare-lighting3d.py target/lighting3d-off
          python3 scripts/browser/prepare-lighting3d.py target/lighting3d-single --single-sided
          python3 scripts/browser/prepare-lighting3d.py target/lighting3d-inline --inline-materials
          python3 scripts/browser/prepare-lighting3d.py target/lighting3d-green --green-materials
          for project in model-receiver model-receiver-no-shadows model-caster model-caster-no-shadows standard-materials standard-materials-legacy imported-emission imported-emission-off surface-normals surface-normals-flat point-lights point-lights-off spot-lights spot-lights-away; do
            cargo run --quiet --package sindri-export --bin sindri-export -- \
              target/$project target/dist/$project --base /examples/benchmark3d/
            cp -R crates/sindri-player/pkg/. target/dist/$project/pkg/
          done
          for lighting_project in lighting3d lighting3d-off lighting3d-single lighting3d-inline lighting3d-green; do
            lighting_source=examples/lighting3d
            if [ "$lighting_project" != lighting3d ]; then lighting_source=target/$lighting_project; fi
            cargo run --quiet --package sindri-export --bin sindri-export -- \
              "$lighting_source" target/dist/$lighting_project --base /examples/lighting3d/
            cp -R crates/sindri-player/pkg/. target/dist/$lighting_project/pkg/
          done
          for daynight_hour in 10 14; do
            python3 scripts/browser/prepare-daynight.py target/daynight-$daynight_hour --hour $daynight_hour --stationary
            python3 scripts/browser/prepare-daynight.py target/daynight-$daynight_hour-off --hour $daynight_hour --stationary --no-shadows
          done
          python3 scripts/browser/prepare-daynight.py target/daynight-night --hour 0 --stationary
          python3 scripts/browser/prepare-daynight.py target/daynight-night-off --hour 0 --stationary --no-night
          python3 scripts/browser/prepare-daynight.py target/daynight-sunrise --hour 7.6 --stationary
          python3 scripts/browser/prepare-daynight.py target/daynight-midday --hour 12 --stationary
          python3 scripts/browser/prepare-daynight.py target/daynight-sunset --hour 17 --stationary
          for daynight_project in daynight daynight-sunrise daynight-midday daynight-sunset daynight-10 daynight-10-off daynight-14 daynight-14-off daynight-night daynight-night-off; do
            daynight_source=target/$daynight_project
            if [ "$daynight_project" = daynight ]; then daynight_source=examples/daynight; fi
            cargo run --quiet --package sindri-export --bin sindri-export -- \
              "$daynight_source" target/dist/$daynight_project --base /examples/daynight/
            cp -R crates/sindri-player/pkg/. target/dist/$daynight_project/pkg/
          done
          cargo run --quiet --package sindri-export --bin sindri-export -- \
            examples/transform target/dist/transform --base /examples/transform/
          cp -R crates/sindri-player/pkg/. target/dist/transform/pkg/
          cargo run --quiet --package sindri-export --bin sindri-export -- \
            examples/orbit target/dist/orbit --base /examples/orbit/
          cp -R crates/sindri-player/pkg/. target/dist/orbit/pkg/
          cargo run --quiet --package sindri-export --bin sindri-export -- \
            examples/character3d target/dist/character3d --base /examples/character3d/
          cp -R crates/sindri-player/pkg/. target/dist/character3d/pkg/
          cargo run --quiet --package sindri-export --bin sindri-export -- \
            examples/model-collision target/dist/model-collision --base /examples/model-collision/
          cp -R crates/sindri-player/pkg/. target/dist/model-collision/pkg/
          python3 scripts/browser/prepare-platformer.py target/browser-platformer
          cargo run --quiet --package sindri-export --bin sindri-export -- \
            target/browser-platformer target/dist/platformer-goal --base /examples/platformer/
          cp -R crates/sindri-player/pkg/. target/dist/platformer-goal/pkg/
