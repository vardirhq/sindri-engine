name: Shapes Lab

on:
  pull_request:
    paths:
      - "games/shapes-lab/**"
      - "crates/sindri-scene/**"
      - "crates/sindri-render/**"
      - "crates/sindri-decay/**"
      - "crates/sindri-export/**"
      - "crates/sindri-player/**"
      - "crates/sindri-runtime/**"
      - "scripts/browser/**"
      - ".github/workflows/shapes-lab.yml"
  push:
    branches: [main]
    paths:
      - "games/shapes-lab/**"
      - "crates/sindri-scene/**"
      - "crates/sindri-render/**"
      - "crates/sindri-decay/**"
      - "crates/sindri-export/**"
      - "crates/sindri-player/**"
      - "crates/sindri-runtime/**"
      - "scripts/browser/**"
      - ".github/workflows/shapes-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Render Shapes Lab
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1
      - uses: ./.github/actions/linux-deps
        with:
          packages: libvulkan1 mesa-vulkan-drivers
      - name: Cache browser tooling
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            scripts/browser/node_modules
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/browser/package.json') }}
      - name: Install browser tooling
        run: |
          npm install --prefix scripts/browser
          npx --prefix scripts/browser playwright install-deps chromium
          npx --prefix scripts/browser playwright install chromium
      # The captures need the bundle to run, not to be small; the optimiser was
      # most of this build, so a pull request skips it.
      - name: Build shared browser host
        env:
          WASM_OPT: ${{ github.event_name == 'pull_request' && '--no-opt' || '' }}
        run: wasm-pack build crates/sindri-player --target web --out-dir pkg $WASM_OPT
      - name: Export Shapes Lab
        run: |
          cargo run --quiet --package sindri-export --bin sindri-export -- \
            games/shapes-lab target/dist/shapes-lab --base /sindri-engine/examples/shapes-lab/
          mkdir -p target/dist/shapes-lab/pkg
          cp -R crates/sindri-player/pkg/. target/dist/shapes-lab/pkg/
          test -f target/dist/shapes-lab/assets/sindri.manifest
          grep -q '"kind": "scene"' target/dist/shapes-lab/assets/sindri.manifest
          grep -q '"kind": "script"' target/dist/shapes-lab/assets/sindri.manifest
      - name: Smoke Shapes Lab in Chromium
        run: |
          mkdir -p target/render-artifacts
          SINDRI_EXPECT_ASSETS=1 \
          SINDRI_EXPECT_ASSET_KINDS=scene,script \
          SINDRI_BASE_PATH=/sindri-engine/examples/shapes-lab/ \
            node scripts/browser/smoke.mjs target/dist/shapes-lab \
            target/render-artifacts/shapes-lab.png
      - name: Upload Shapes Lab capture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shapes-lab-capture
          path: target/render-artifacts/shapes-lab.png
          if-no-files-found: warn
          retention-days: 14
