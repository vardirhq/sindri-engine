name: Sindri Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploys share one group and are never cancelled, so two pushes to main cannot
# race to publish. A pull request only builds the site to prove it assembles,
# so each has its own group and a newer push cancels the older build, rather
# than every open pull request queueing behind every other one and the deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Sindri site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # wasm-pack from its prebuilt release rather than a source build: the
      # binary is identical and the compile was minutes of every deploy.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1
      - name: Install site tools
        run: python -m pip install --disable-pip-version-check 'Markdown==3.8.2'
      # `wasm-opt` is for what gets deployed. A pull request only proves the
      # site assembles, so it skips the optimiser, which is most of each build.
      - name: Build the browser host
        env:
          WASM_OPT: ${{ github.event_name == 'pull_request' && '--no-opt' || '' }}
        run: wasm-pack build crates/sindri-player --target web --release --out-dir pkg $WASM_OPT
      - name: Build Voxel Lab
        env:
          WASM_OPT: ${{ github.event_name == 'pull_request' && '--no-opt' || '' }}
        run: wasm-pack build games/voxel-lab --target web --release --out-dir pkg $WASM_OPT
      - uses: actions/configure-pages@v6
        id: pages
        if: github.event_name != 'pull_request'
        with:
          enablement: true
      - name: Assemble Sindri site
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          rm -rf target/pages
          mkdir -p target/pages/assets
          cp site/index.html target/pages/index.html
          cp site/site.css target/pages/assets/site.css
          cp -R site/screenshots target/pages/assets/screenshots
          # Every example is exported through the real project pipeline. This
          # keeps Pages honest about exactly what desktop/browser exports ship.
          for project in \
            "examples/tween:tween" \
            "examples/camera:camera" \
            "examples/spatial:spatial" \
            "examples/physics:physics" \
            "examples/input:input" \
            "examples/audio:audio" \
            "examples/sequence:sequence" \
            "examples/ui:ui" \
            "game:causeway" \
            "games/flappy:flappy" \
            "games/orbital-baked:orbital-baked" \
            "games/shapes-lab:shapes-lab" \
            "games/weave-poc:weave-poc" \
            "games/platformer:platformer" \
            "games/scorchball:scorchball" \
            "games/low-tide:low-tide"; do
            src="${project%%:*}"
            route="${project##*:}"
            cargo run --quiet --package sindri-export --bin sindri-export -- \
              "$src" "target/pages/examples/$route" --base "${PAGES_BASE_PATH}/examples/$route/" \
              --build-id "${GITHUB_SHA:0:7}"
            mkdir -p "target/pages/examples/$route/pkg"
            cp -R crates/sindri-player/pkg/. "target/pages/examples/$route/pkg/"
          done
          mkdir -p target/pages/examples/voxel-lab/pkg
          cp games/voxel-lab/web/index.html target/pages/examples/voxel-lab/index.html
          cp -R games/voxel-lab/pkg/. target/pages/examples/voxel-lab/pkg/
          python site/build_docs.py target/pages
          python site/build_directory.py target/pages
          touch target/pages/.nojekyll
      - name: Verify assembled routes
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          test -f target/pages/index.html
          test -f target/pages/directory/index.html
          python - <<'CHECK'
          import os, pathlib, re, sys

          root = pathlib.Path("target/pages")
          refs = sorted(set(re.findall(
              r'(?:href|src)="./([^"#]+)"', (root / "index.html").read_text())))
          missing = [
              ref for ref in refs
              if not (root / ref).is_file() and not (root / ref / "index.html").is_file()
          ]
          for ref in refs:
              print(("MISSING " if ref in missing else "ok      ") + ref)
          base = os.environ.get("PAGES_BASE_PATH", "")
          for page in (root / "examples").glob("*/index.html"):
              if page.parent.name == "voxel-lab":
                  continue
              expected = f'<base href="{base}/examples/{page.parent.name}/">'
              if expected not in page.read_text():
                  missing.append(f"base path in {page}")
          sys.exit(1 if missing else 0)
          CHECK
          test -f target/pages/docs/scripting/index.html
          test -f target/pages/docs/language/index.html
          for route in physics ui spatial camera tween causeway flappy orbital-baked shapes-lab weave-poc platformer scorchball low-tide; do
            test -f "target/pages/examples/$route/index.html"
            test -f "target/pages/examples/$route/assets/sindri.manifest"
            test -f "target/pages/examples/$route/pkg/sindri_player.js"
            test -f "target/pages/examples/$route/pkg/sindri_player_bg.wasm"
            grep -q '"kind": "scene"' "target/pages/examples/$route/assets/sindri.manifest"
          done
          test -f target/pages/examples/voxel-lab/index.html
          test -f target/pages/examples/voxel-lab/pkg/voxel_lab.js
          test -f target/pages/examples/voxel-lab/pkg/voxel_lab_bg.wasm
          grep -q 'voxel-stats' target/pages/examples/voxel-lab/index.html
          grep -q '"kind": "prefab"' target/pages/examples/orbital-baked/assets/sindri.manifest
          grep -q 'player.sheet' target/pages/examples/orbital-baked/assets/sindri.manifest
          grep -q '"kind": "script"' target/pages/examples/shapes-lab/assets/sindri.manifest
          grep -q '"demo.weave"' target/pages/examples/weave-poc/assets/sindri.manifest
          grep -q 'hero.sheet' target/pages/examples/platformer/assets/sindri.manifest
          grep -q 'prefabs/coin.prefab' target/pages/examples/platformer/assets/sindri.manifest
          grep -q 'players.sheet' target/pages/examples/scorchball/assets/sindri.manifest
          grep -q 'player.prefab' target/pages/examples/scorchball/assets/sindri.manifest
      - name: Check directory in desktop and mobile browsers
        run: |
          npm install --prefix scripts/browser
          npx --prefix scripts/browser playwright install --with-deps chromium
          node scripts/browser/directory.mjs target/pages target/directory-captures
      - name: Upload directory captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: directory-captures
          path: target/directory-captures
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: target/pages

  deploy:
    name: Deploy Sindri site
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
