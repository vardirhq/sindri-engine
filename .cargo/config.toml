# Tests built for the browser target run in Node through wasm-bindgen's runner,
# which `cargo test --target wasm32-unknown-unknown` invokes as the runner for
# each test binary. Install it with:
#
#     cargo install wasm-bindgen-cli --version 0.2.128 --locked
#
# The version has to match the `wasm-bindgen` the workspace resolves.
[target.wasm32-unknown-unknown]
runner = "wasm-bindgen-test-runner"

# `cargo editor <scene or project>` runs the editor optimised, the way to use
# it rather than to work on it. See [profile.editor] in Cargo.toml.
[alias]
editor = "run --profile editor --package sindri-editor --"
