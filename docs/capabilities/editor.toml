title = "Unsaved marker and confirmations"
summary = "Unsaved means the world and file differ, and anything that would throw unsaved work away asks first."
status = { engine = "n/a", editor = "yes", decay = "n/a", proof = "n/a" }
tests = ["editor/src/native/tests/scene.rs"]
