]
proof = ["games/low-tide"]
limits = [
  "There is no session persistence on desktop or web; history is session-only.",
  "The dive interior is an authored activity, not a generated terrain cross-section.",
]
detail = """
Low Tide's Basin is a voxel world viewed as a map. It exercises sparse
`Grid.set_block` edits for biome harvesting, typed shared state and deck tiles
for its six-resource hold (four slots on the small starter crawler, growing to
sixteen through three resource-funded stern extensions), and prefab spawning
for deterministic wrecks across the Basin. Keyboard and phone-touch runtime
tests harvest, carry, stow and jettison actual blocks; the workbench consumes
physical cargo for deck expansion, a bunk and an engine upgrade, preserving the
crew and deck origin while driving. Its viewport-sized workbench exposes three
directly selectable blueprints, current cargo versus cost, installed and
chassis-limit states and explicit actions.

Its wrecks spawn six resource-specific cargo prefabs as hull children; Decay
selects the nearby physical crate and retains a per-slot mask across wreck
streaming. Carried cargo can be set down as a world prefab and picked up again
before stowing. Its instrument HUD uses authored atlas icons, real hold
segments and speed/phase-time meters, and discard confirmation is tied to a
cell and cancels on movement, Escape or timeout.

A side-view high-tide dive frames a wreck tilemap with a second authored
camera; Decay swims against hull cells, manages air and a heavy cache, then
deposits ore and scrap in the original hold only after returning. The map tide
continues; recall, empty air and ebb recover crew without loot. It found the
reversible map flood capability; its season, cargo loss, waiting and escape
rules are Decay gameplay. These are Decay gameplay rules on existing engine
APIs.
"""

