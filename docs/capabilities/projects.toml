[[capability]]
id = "causeway"
group = "Games"
title = "Causeway"
summary = "The flagship showcase: a tactics game of three wardens holding islands against the Hollow until the tide closes the causeway."
status = { engine = "n/a", editor = "n/a", decay = "yes", proof = "yes" }
tests = [
  "game/tests/the_game_is_played/main.rs",
  "game/tests/the_game_holds_together.rs",
  "game/tests/a_crossing_is_played.rs",
]
proof = ["game"]
detail = """
Causeway is a turn-based tactics game. Three wardens hold an eight-by-eight
island while the Hollow cross the causeway from the mainland at low tide; each
Hollow shows on the ground what it will strike, and a shove that moves it moves
its strike, so a turn is read and answered rather than raced. The tide comes in
on a schedule shown in advance, drowning any Hollow it reaches, and high tide
closes the causeway and wins the island. Four islands make a crossing, with a
boon chosen between them and the Hearth carried from one to the next.

The rules are one value and pure shared functions in `rules.decay`, so aiming
previews a skill by running it on a copy of the board; the director plays back
the beats each change leaves. The islands are text in `islands.decay`, read by
the rules and by `tools/causeway_art.py`, which builds every island, figure and
building as a low-poly GLB. It uses imported models with point lights, the
environment's grade and bloom in the shipped player, Weave screens, the
pointer's world ray for picking cells, camera shake, and Sound Lab effects and
an Ogg song. `a_crossing_is_played.rs` plays a whole crossing with a bot
through the real rules; `the_game_is_played` plays it by clicks and keys.
"""

