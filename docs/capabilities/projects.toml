id = "low-tide"
group = "Games"
title = "Low Tide"
summary = "The moving-home genre showcase: drive a crawler across a drained voxel sea, gather cargo, and escape the returning tide."
status = { engine = "n/a", editor = "n/a", decay = "yes", proof = "yes" }
tests = [
