[[capability]]
id = "platformer"
group = "Games"
title = "The platformer"
summary = "The first genre showcase: a painted, solid tilemap level, a controller-driven hero, ten coins and a flag, with no Rust of its own."
status = { engine = "n/a", editor = "n/a", decay = "yes", proof = "yes" }
tests = [
  "games/platformer/tests/a_run_reaches_the_flag.rs",
  "games/platformer/tests/painted_ground.rs",
  "games/platformer/tests/character_gameplay.rs",
  "scripts/browser/platformer-goal.mjs",
]
proof = ["games/platformer"]
limits = [
  "No enemies or hazards.",
  "No level after the first, no pause and no restart without Stop.",
]
detail = """
A side-view level painted as a tilemap and made solid by a Tilemap Collider 2D,
a hero who runs and jumps, ten coins and a flag, a HUD, and a camera that
follows. The scene and its Decay scripts are the game, and it exports to the
site.

Its hero uses the scene-owned Character 2D controller. Decay integrates
velocity and gravity, queues displacement and reads cached walkable support.
One capsule probe checks ground obstacles; body and foot sensors preserve
pickups independently. Walls, ceilings and one-way undersides never grant
standing. It gives the jump a buffer for a press just before landing and coyote
time for one just after running off a ledge. Letting go early cuts the rise
short.

It found three gaps, all closed as general capabilities: a script moving a
body's transform was undone by the next physics step, so a respawn did nothing;
a frictionless hero clung to walls because friction averaged; and camera
behaviors ran only in the camera example. Its tests stand the hero on the
painted ground, have a scripted player reach the flag without falling, and hold
the camera to following it inside the level. Its joints, materials, one-way
planks, ferry, forces and lighting are listed with those capabilities.
"""

[[capability]]
id = "scorchball"
group = "Games"
title = "Scorchball"
summary = "The local-multiplayer genre showcase: couch football for two to four pads, ported from Unity with no Rust of its own."
status = { engine = "n/a", editor = "n/a", decay = "yes", proof = "yes" }
tests = [
  "games/scorchball/tests/a_match_is_played.rs",
  "games/scorchball/tests/a_bot_plays.rs",
]
proof = ["games/scorchball"]
limits = [
  "No music: the original tracks' terms are unchecked, and MP3 is an exception the dependency policy would rather not grow.",
  "No match end, pause or restart without Stop.",
  "Bots do not pass, go for power-ups on purpose, or come in difficulties.",
  "Played with real pads by nobody yet: CI has none.",
]
detail = """
A scene, four prefabs and four Decay scripts are the game, and it exports to
the site. Gamepads were the capability it needed and were added for it as a
general one.

**Players are made when a pad joins.** The match reads `Gamepad.joined()`,
spawns a player prefab, and authors its slot with `World.set_property`; odd
slots play for Blue and even for Red. Unplugging a pad takes its player off
through `Gamepad.left()`. Each player readies with North, picks one of two
characters with the d-pad, walks with the left stick and kicks with the right
bumper, aimed with the right stick, all read through its own slot.

**Scripts talk by type and by event.** A player kicks the ball with a typed
message (`this.ball.kick(velocity, slot)`) and bends the shot with `nudge`; the
match counts players whose live `ready` field is set; a power-up sends
`power_up` to the player who took it, or emits `WindPicked` or `FirePicked`;
the ball sends `catch_fire` to an opponent it touches while alight, and emits
`GoalScored` when it crosses a goal line. Possession, pickups and reach are
distance checks, because a collider does not scale with its entity and the
Enlarger makes a player bigger.

**It found two gaps, both closed.** A child sprite was drawn from its own
transform alone; a child's transform is now local to its parent everywhere. And
the test harness did not lay out screen text, so a misspelled text anchor
passed every test; the harness now lays it out each step.

**It is checked, not just run.** The tests press pads: two join on their own
sides, ready up and kick off; Blue takes the ball, dribbles past Red and
scores; a sign cannot be taken until it lands; unplugging a pad takes its
player off; Blue collects all four powers; and a Fireball sets an opponent
running wild until it burns out. Select in the lobby adds a bot, which attacks,
supports, defends goal-side of the ball and goes for loose balls it can reach
first; the tests have one score on a player standing still, and two play each
other until one scores.
"""

