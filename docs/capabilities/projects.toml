detail = """
A quad is drawn centred on its entity, so without an anchor the middle of the
picture is what lands on the tile. A sheet declares where its sprites meet the
ground, and `sindri.tilemap` has `tile_overhang`, how far below its cell a
tile's art may reach: the cell is unchanged and still what the grid, picking,
occupancy and gameplay measure in; only the drawn quad grows, downward.
"""
