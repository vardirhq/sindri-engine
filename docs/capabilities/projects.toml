[[capability]]
id = "isometric-baker"
group = "Tooling"
title = "The isometric baker"
summary = "`tools/isometric-baker` bakes a 3D model into an ordinary sprite sheet and its `.sheet`, offline, in isometric, top-down or side views."
status = { engine = "n/a", editor = "n/a", decay = "n/a", proof = "yes" }
tests = [
  "tools/isometric-baker/test/bake.test.ts",
  "tools/isometric-baker/test/anchor.test.ts",
  "tools/isometric-baker/test/grain.test.ts",
  "tools/isometric-baker/test/tile-overhang.test.ts",
]
proof = ["games/orbital-baked/assets/textures/detonation.isobake"]
docs = ["docs/isometric-baker.md"]
detail = """
Nothing the engine, editor, native game or browser export builds depends on the
tool: the assets it produces are ordinary PNGs and sheet documents, and by the
time a game loads one there is nothing left to say it was baked.

It bakes three views. Isometric is the default; **top-down** and **side** were
added because the isometric camera cannot reach them by any choice of tile.
The flat views state `pixels_per_unit` rather than deriving a scale from a
diamond they do not draw, and each view refuses the other's fields. A `grain`
option shifts texels along a material's ramp, hashed from the texel's position
on the model, so the same texel is the same shade in every bake. Height is
baked rather than scaled, so a slab is its own tile. The baker refuses art that
overhangs its own footprint, and a sheet declares where its sprites meet the
ground.

Orbital Last Stand uses it for one thing: `textures/detonation.isobake` bakes a
five-frame blast, top-down, as `variants` of one sheet, and
`scripts/detonation.decay` plays the clip and despawns when
`Animation.is_finished` says it ended.
"""

