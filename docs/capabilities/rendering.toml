while an image is open: columns, rows, margin and spacing are drags, so a
packed sheet with gutters can be cut and not only one that divides edge to
edge. A cell is named by clicking it, and the panel lists the cells that have
names rather than a field per cell, so a 16x16 atlas is as workable as a
four-frame strip. Saving writes the sidecar, and the browser then lists the
sprites underneath the image, collapsed until asked for. A sprite's animation
inspector creates, renames, and removes clips from those named cells, orders
frames, edits timing and looping, chooses the runtime clip, and previews it
without changing scene state.
"""

