[[capability]]
id = "tilemaps"
group = "Tilemaps and tile volumes"
title = "Tilemaps (ortho + iso, overhang)"
summary = "One entity draws a grid of sheet tiles into the same batches as loose sprites, painted in the Scene view."
status = { engine = "yes", editor = "yes", decay = "yes", proof = "yes" }
parity = "Tilemaps (ortho + iso, overhang)"
tests = [
  "crates/sindri-scene/tests/extraction/tilemap.rs",
  "editor/src/tilemap/tests.rs",
]
proof = ["games/platformer", "games/low-tide"]
limits = ["Screen-space tilemaps render and edit as data, but direct painting is limited to world space."]
detail = """
A tilemap is a grid of tiles drawn from one entity: `sindri.tilemap` carries
the map's grid, a palette of sprite names, and a flat array of cells indexing
that palette, with `null` where the map is empty. Its cells become instances in
the same batches loose sprites use, so a prop sorts among the floor rather than
behind it. Columns and rows lay out orthogonally or isometrically, and placing a
tile and finding the tile under a point are inverses on every cell of both.

Selecting a world-space tilemap shows the slices from its texture's sheet as a
visual palette, lets its grid be resized while preserving the overlap, and
turns primary drag in the Scene view into an undoable paint or erase stroke.
The hovered cell is found by inverting the exact camera matrix used to render
that viewport, so an orthographic or isometric map does not need separate
picking approximations. The ordinary component fields still edit projection,
tile size, tint, render layer, and space.
"""

