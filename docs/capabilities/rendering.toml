[[capability]]
id = "sprites"
group = "Sprites and shapes"
title = "Sprites, sheets, UVs, layers, blending"
summary = "Textured sprites in screen or world space, batched per space, layer and texture, cut by named sheet parts."
status = { engine = "yes", editor = "yes", decay = "partial", proof = "yes" }
parity = "Sprites, sheets, UVs, layers, blending"
tests = [
  "crates/sindri-gpu/tests/sprite_batches_are_independent.rs",
  "crates/sindri-gpu/tests/sprite_uv_rect.rs",
  "crates/sindri-gpu/tests/world_sprites.rs",
  "crates/sindri-gpu/tests/sprite_textures_follow_their_registry.rs",
  "crates/sindri-render/src/sprite_batch/tests.rs",
  "crates/sindri-scene/tests/extraction/sprites.rs",
  "crates/sindri-core/src/sheet/tests.rs",
]
proof = ["games/platformer", "games/orbital-baked"]
detail = """
Textured sprites carry tint, anchor, and layer. A sprite is either
screen-anchored, which is the default and cannot be occluded by the world, or
in the world, drawn through the world camera by its full transform and hidden
by opaque geometry in front of it. Sprites batch per space, layer, and texture,
with a measured five-to-one draw-call reduction. Each batch draws with its own
camera and its own instances, from buffers of its own; a GPU test draws two
batches at two scales into one frame and reads back the pixels that only come
out right when they stayed separate.

**A sliced image says how it is cut, once.** A sheet document beside a
texture — `textures/tiles.png` is sliced by `textures/tiles.sheet`, at a
derived ID nothing has to declare — names the parts of it, either as a grid or
as explicit rects. A scene then writes `textures/tiles.png#floor`, and the `#`
that had always been rejected inside an asset ID is what carries the name,
because it was reserved so a fragment could not leak into a path. Names rather
than indices, so a re-slice that moves a cell does not silently change what a
scene draws. Rects are checked once, where a sheet binds, and ride on the
instance so every part of one sheet stays in one draw call — a GPU test reads
the pixels back to prove the shader honours it. A name no loaded sheet places
draws the whole image and is reported by `unresolved_sprites`, the same rule an
unbound texture follows.
"""

[[capability]]
id = "sprite-colour-transform"
group = "Sprites and shapes"
title = "Advanced sprite colour transform"
summary = "Per-instance RGBA multipliers and offsets, `sample * tint * multiply + offset`, without breaking batches."
status = { engine = "yes", editor = "yes", decay = "yes", proof = "yes" }
parity = "Advanced sprite colour transform"
tests = ["crates/sindri-scene/tests/extraction/sprites.rs"]
proof = ["games/orbital-baked"]
docs = ["docs/color-transform-design.md"]
detail = """
A sprite may carry independent RGBA multipliers and offsets evaluated as
`sample * tint * multiply + offset`, travelling per instance so two sprites
recoloured differently still share a draw call. The identity is
`multiply = [1, 1, 1, 1]` and `offset = [0, 0, 0, 0]`, so a sprite authored
before the transform existed draws exactly as it did. A transform that is not
finite is refused at extraction rather than drawn — the reachable case is
narrowing, since `1e39` is an ordinary `f64` and an infinity once it is an
`f32` — while a finite value outside zero to one is left alone for the render
target to clip. The editor draws the two quadruples as labelled RGBA rows inside
an advanced section, collapsed until the scene has authored one and resettable
to the identity. Orbital's mine blast flashes white-hot through the colour
offset, which a tint cannot do, and cools within a few frames.
"""

[[capability]]
id = "procedural-shapes"
group = "Sprites and shapes"
title = "Procedural shapes"
summary = "Rectangles, ellipses, grids, regular polygons and up-to-eight-point hulls evaluated crisply in the shape shader."
status = { engine = "yes", editor = "partial", decay = "yes", proof = "yes" }
parity = "Procedural shapes"
tests = [
  "crates/sindri-render/src/shape/mod.rs",
  "crates/sindri-decay/tests/a_script_authors_shape.rs",
  "games/orbital-baked/tests/every_boss_is_its_own.rs",
]
proof = ["games/orbital-baked"]
detail = """
Rectangles, ellipses, grids, and regular polygons are evaluated in the shape
shader. A polygon may also carry up to eight explicit 2D vertices; those points
travel in the same instanced payload and the shader measures against the
actual authored edges, so an irregular hull remains crisp without becoming a
texture. When no points are authored, regular polygons keep their existing
path. The eight-point cap keeps the per-instance vertex attributes inside
Sindri's conservative WebGPU limits. Orbital Last Stand exercises the
capability with the Strider's exact six-point hull.
"""

[[capability]]
id = "sprite-shaders"
group = "Sprites and shapes"
title = "Custom shaders / materials"
summary = "A sprite can be drawn through a project `.wgsl` function, validated with naga by every host and hot-reloaded in the editor."
status = { engine = "partial", editor = "yes", decay = "yes", proof = "partial" }
parity = "Custom shaders / materials"
tests = [
  "crates/sindri-render/src/sprite_shader/tests.rs",
  "crates/sindri-gpu/tests/sprite_shaders.rs",
  "crates/sindri-scene/tests/extraction/sprite_shaders.rs",
  "game/tests/the_sprite_shader_demo_works.rs",
]
proof = ["examples/sprite-shaders"]
docs = ["docs/sprite-shaders.md"]
limits = ["Shaders reach `sindri.sprite` only, with one texture and no material asset."]
detail = """
`sindri.sprite` names a `.wgsl` asset in `shader` and carries four
`shader_params`. The file defines
`fn sprite_shader(input: SpriteShaderInput) -> vec4<f32>`, handed the pixel as
it would draw unshaded, its UVs and the sprite's UV rect, its world position,
the four parameters and the scene's clock, with `sample_sprite` and
`sprite_texel_size` to read the texture again; the engine supplies the vertex
stage and pipeline around it. Parameters ride on the instance, so sprites
sharing a texture and a shader share a draw. Every host validates a shader with
naga as it binds it: the editor loads, watches and hot-reloads the ones a scene
names, `sindri-player` reads them natively and from the export manifest, and
`sindri-export` refuses one that does not compile. A failure names the file and
the line in the project's own numbering and the sprite falls back to the
built-in look. Decay writes `this.sprite.shader_params.{x,y,z,w}`.
`examples/sprite-shaders` draws an outline, a dissolve, a hit flash and a wave.
"""

