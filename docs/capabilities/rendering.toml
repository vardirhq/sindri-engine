[[capability]]
id = "sprite-animation"
group = "Sprite animation"
title = "Sprite frame clips, timing, loop state"
summary = "Clips of named sheet parts, played as runtime state and chosen by scripts without dirtying the scene."
status = { engine = "yes", editor = "yes", decay = "yes", proof = "yes" }
parity = "Sprite frame clips, timing, loop state"
tests = [
  "crates/sindri-scene/src/animation/tests.rs",
  "crates/sindri-scene/tests/extraction/animation.rs",
  "crates/sindri-decay/tests/a_script_plays_a_clip.rs",
  "games/low-tide/tests/a_crawler_looks_alive.rs",
]
proof = ["games/low-tide", "games/platformer"]
detail = """
`sindri.animation.sprite` holds clips of sprite names and which one plays,
`SpriteAnimations` holds where each sprite has got to, and the cursor holds a
name rather than a rect so playback does not depend on where anything sits in
an image. Playback is runtime state, so watching an animation run does not
rewrite the scene it came from.

`Animation.play`, `stop` and `restart` name one of the clips the scene
authored; `is_finished`, `frame` and `clip` read where playback has got to;
`set_speed` scales it. Choosing is authored state and writes the component, so
it lives in the world and undoes and saves like anything else, while the cursor
is derived and is only read — which is what keeps a script driving an
animation from dirtying the scene. `play` is idempotent so that the natural way
to write it (`if moving { play("walk") }`, named on every frame) runs the clip
instead of pinning it to frame one; `restart` is the separate thing to want.

An animated sprite whose reference names no part of its sheet draws the first
frame of the clip it is playing rather than the whole sheet, so a scene shows a
pose before anything has run it — in a game's opening frame, in an offscreen
capture, and in the editor outside play mode. Once a clip is running it decides
alone: a frame that resolves to nothing draws the whole image rather than the
resting pose, because a plausible picture of the wrong moment is the failure
that hides.

Low Tide exercises speed-controlled clips on children of a moving deck: its two
tread belts roll with actual movement, pivot in opposite directions, hold their
frame while flooded and resume after the ebb.
"""

