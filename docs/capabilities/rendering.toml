detail = """
`sindri.tile_grid` carries the geometry — columns, rows, cell size,
projection, and the screen step one level costs — and `sindri.tile_volume`
carries sparse cells at integer `(column, row, level)` coordinates naming tiles
in a reusable `.tileset` asset. Empty is absence rather than a reserved ID, so
an empty sky costs nothing to store. A tile says what its faces look like,
whether it hides a neighbour's shared face, whether it is solid, and how much of
its cell it fills; the renderer resolves each occupied cell into only the faces
nothing covers, so a column two blocks taller than its neighbour exposes two
side faces without a cliff case and removing a lower block opens a real hole.

**A tile can be shorter than its cell.** `height` is a fraction of a cell
measured from its floor, defaulting to one. A half is a slab. The value is
logical: it decides what the tile hides and how high something standing on it
stands, and says nothing about the art. Anything taller than one cell is
refused when the asset decodes, because occlusion and occupancy both assume a
cell's contents stay inside it. A neighbour hides a side face only when it is at
least as tall as the face it abuts, and a top face survives a block placed
above it unless the tile fills its cell.

**Both projections are real.** `orthogonal` or `isometric` decides where a cell
sits, which of its faces a view can see, and what "behind" means. One tile set
serves both: faces a projection cannot see are left undrawn. Depth belongs to a
cell's column rather than to each drawn face, so a tower keeps the depth of the
column it stands in.

**Runtime tile volumes have one engine-owned chunk unit.** A chunk is 16×16
columns, addressed with Euclidean coordinates and held sparsely by
`TileChunkStore`; materializing it produces the existing scene component.

**A volume is resolved once, not every frame.** It is resolved into faces once
and replayed, with only the depth each cell sorts at measured again. `World`
gives each entity a revision, bumped whenever anything takes a mutable borrow
of it, and `TextureBindings` and `TileSetBindings` each carry a generation,
handed out process-wide; a volume keeps the ones it was built from, so editing
its cells, moving it, changing its grid, rebinding its tile set and re-cutting
its atlas each show up on the next frame. `baked_volume.rs` is one test per
input: each edits exactly one of them and fails if the volume goes on drawing
what it drew before.

**A script reaches one cell at a time.** `Grid.block(volume, column, row,
level)` answers with the tile a cell holds and `Grid.set_block` writes one,
with the empty string meaning absence in both directions. A write naming a tile
the volume's own tile set does not define is refused at the call.
"""

[[capability]]
id = "tile-volume-navigation"
group = "Tilemaps and tile volumes"
title = "Navigation over tile volume surfaces"
summary = "A volume's walkable surface becomes grid walls by `max_step`, and `Grid.walkable` asks the same question from a script."
status = { engine = "yes", editor = "n/a", decay = "yes", proof = "no" }
tests = [
  "crates/sindri-scene/tests/navigation/volume.rs",
  "crates/sindri-decay/tests/a_script_asks_what_is_walkable.rs",
  "crates/sindri-scene/tests/extraction/standing_on_ground.rs",
]
limits = [
  "`Grid.walkable` is about a cell, not an edge, so a script-driven walker does not honour `max_step`.",
  "Separate climb and drop limits wait on directional edges.",
]
detail = """
A volume is three-dimensional and grid navigation is not, so the bridge is a
*surface*: for each column, the height of the ground something walking across
it stands on — the top of its highest solid cell, which is a fraction rather
than a level because a slab's top genuinely sits half a cell lower than a
block's. A column holding nothing solid has no surface at all: it is a hole.
Every edge between two columns is then either a step something can take or one
it cannot, and `sindri-grid` already refuses to cross a blocked edge — so the
volume becomes walls rather than the pathfinder learning about levels.
`sindri.grid.navigation` carries `max_step`, one cell by default.

A grid still carrying `sindri.tilemap` navigates by that flat map alone, so
dropping a volume beside an existing floor never closes ground the game already
walks on. Only `WorldGridNavigation::from_world_with_tile_sets` can answer at
all, because which cells are solid and how tall they are is a question only the
tile set answers.

`Grid.walkable(floor, x, y)` answers whether a walker can stand where a point
falls, from the walkable surface the pathfinder walks, choosing the cell by
`sindri_scene::nearest_cell`, the same rule a walker's own placement reads
from. Off the grid, water, decoration and empty columns all answer the same
way. An authored occupant rests on whatever *supports* it; a walker stands only
on what is *walkable*.
"""

