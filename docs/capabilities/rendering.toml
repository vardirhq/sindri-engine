[[capability]]
id = "frame-pipeline"
group = "Frame and scene extraction"
title = "Extraction, preparation and ordered passes"
summary = "Frames are extracted from the world, validated and ordered deterministically by stage, layer and insertion."
status = { engine = "yes", editor = "yes", decay = "n/a", proof = "yes" }
tests = [
  "crates/sindri-render/src/frame.rs",
  "crates/sindri-scene/tests/extraction/passes.rs",
  "crates/sindri-scene/tests/extraction/textures.rs",
  "crates/sindri-scene/tests/extraction/assets.rs",
]
proof = ["games/platformer"]
docs = ["docs/rendering-frame-pipeline.md", "docs/scene-extraction.md"]
detail = """
A frame goes through extraction, preparation, and rendering. Preparation
validates and orders passes deterministically by stage, then layer, then
insertion order; stage order is `Opaque3d`, `Transparent2d`, `Overlay`.

Gameplay writes to the world and nothing tells the renderer. `SceneExtractor`
derives an ordered frame from whatever the world currently holds, using the
built-in camera, mesh, sprite, tilemap, animation, and text schemas. No scene
needs hand-written extraction code.

Textures bind by reference: a scene names `textures/badge.png`, the renderer
knows only a `TextureId`, and one place knows both. An unbound reference draws
a magenta checker and is reported by name rather than failing the frame or
silently reusing the last texture.
"""

