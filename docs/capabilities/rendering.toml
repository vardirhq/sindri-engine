[[capability]]
id = "lights-2d"
group = "2D lighting"
title = "2D lights and shadows"
summary = "Ambient plus point lights, normal maps and polar-depth shadows from occluders and tilemaps, for sprites, tiles and maps."
status = { engine = "yes", editor = "partial", decay = "yes", proof = "yes" }
parity = "2D lights and shadows"
tests = [
  "crates/sindri-render/src/light2d/tests.rs",
  "crates/sindri-gpu/tests/sprite_lights.rs",
  "crates/sindri-scene/tests/extraction/lights_2d.rs",
  "games/platformer/tests/cave_lights.rs",
  "games/low-tide/tests/the_basin_is_lit.rs",
]
proof = ["games/platformer", "games/low-tide"]
docs = ["docs/2d-lights.md"]
limits = ["A frame carries the 16 lights nearest the camera."]
detail = """
With `lighting_2d` on in `sindri.environment`, world sprites, tilemaps, flecks
and world shapes are multiplied by the light reaching them: an ambient color
plus every `sindri.light2d` point light within its radius, faded by its
falloff. A sprite opts out with `unlit`, additive shapes are light themselves,
and the UI is never lit. A sprite or tilemap may name a `normal_map` laid out
like its texture; a light's `height` then decides how squarely it meets each
texel, so a low light rakes across the relief. A light with `shadows` on is
blocked by `sindri.light2d.occluder` boxes, polygons and the solid cells of a
tilemap, through one-dimensional polar depth maps built on the CPU each frame.
Decay writes a light's color, intensity, radius, falloff and height. The Scene
view draws light radii and occluder outlines with handles. The platformer's
cave is the proof. A voxel world viewed as a map is lit too, and its
`normal_maps` name a normal map for each texture its squares draw from: Low
Tide's Basin is lit by a sun that follows the tide from noon through a golden
hour to a moonlit flood, and its crawler carries lamps and shadow-casting
headlights.
"""

