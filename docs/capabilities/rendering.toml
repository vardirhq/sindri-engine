title = "Hosts and rendering"
order = 7
intro = """
How a game reaches a window or a browser, how the GPU is negotiated, and what
the renderer can actually draw: sprites, shapes, text, 2D lighting, tilemaps
and tile volumes, 3D meshes and models, and the world presentation stack.
`docs/rendering-frame-pipeline.md`, `docs/rendering-surface.md` and
`docs/rendering-color.md` are the contracts.
"""

[[capability]]
id = "hosts"
group = "Hosts and GPU"
title = "Native desktop"
summary = "One `Game` loop runs windowed on desktop, in a browser and headless, with failures reaching the host whole."
status = { engine = "yes", editor = "yes", decay = "n/a", proof = "yes" }
parity = "Native desktop"
tests = [
  "crates/sindri-desktop/src/host/app.rs",
  "crates/sindri-platform/tests/game_loop.rs",
]
proof = ["games/platformer", "games/orbital-baked"]
docs = ["docs/platform-host.md"]
detail = """
`Game` receives `start`, `fixed_update`, `update`, and `stop`, each with a
`FrameContext` carrying the world, the input state, and frame time, and each
able to fail in a way that reaches the host rather than being swallowed. The
same loop runs windowed on a desktop, in a browser through the same `winit`
event loop and canvas attachment, and headless in a test.

`DesktopApp` supplies the window, event loop, and input translation once, so
an application does not rewrite them. Target-specific code is confined to the
crates that must have it. Application failures retain their complete
`std::error::Error` source chain when logged natively or announced through the
browser's `sindri:failed` event, rather than exposing only the outer host
error.
"""

