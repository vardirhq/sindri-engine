[package]
name = "sindri-camera-demo"
description = "Tests that play the Camera Lab, a gameplay camera behaviour project"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# No game code: the lab is its scene, Decay and stylesheet in `assets/`, and
# `sindri-player examples/camera` plays it. What lives here is the harness
# its tests play it through.
[lib]
path = "src/lib.rs"

[dependencies]
sindri-runtime = { path = "../../crates/sindri-runtime" }

[dev-dependencies]
serde_json.workspace = true
sindri-core = { path = "../../crates/sindri-core" }
sindri-platform = { path = "../../crates/sindri-platform", default-features = false }
sindri-scene = { path = "../../crates/sindri-scene" }

[lints]
workspace = true
