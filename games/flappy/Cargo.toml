[package]
name = "flappy"
description = "The one-button Flappy showcase, and the harness that plays it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# The game itself remains scene data plus Decay. This crate is only the
# headless harness used to prove that project through the public engine pieces.
[lib]
path = "src/lib.rs"

[dependencies]
sindri-core = { path = "../../crates/sindri-core" }
sindri-decay = { path = "../../crates/sindri-decay" }
sindri-platform = { path = "../../crates/sindri-platform" }
sindri-scene = { path = "../../crates/sindri-scene" }
serde_json.workspace = true

[lints]
workspace = true
