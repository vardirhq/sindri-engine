format_version = 1

[project]
name = "Lamplighter"
main_scene = "assets/title.scene"
scenes = [
  "assets/world.scene",
  "assets/village.scene",
  "assets/interior-bakery.scene",
  "assets/interior-child-house.scene",
  "assets/interior-workshop.scene",
  "assets/interior-keeper.scene",
  "assets/pause.scene",
  "assets/wilds.scene",
]

# The screen UI's look (Weave): an entry stylesheet and what it uses.
[assets]
include = ["ui.weave", "audio/gather.wav", "audio/build.wav", "audio/feed.wav", "audio/light.wav", "audio/pounce.wav", "audio/found.wav", "audio/step.wav", "audio/under-the-lid.ogg"]
