format_version = 1

[project]
name = "Lamplighter"
main_scene = "assets/title.scene"
scenes = [
  "assets/levels.scene",
  "assets/settings.scene",
  "assets/pause.scene",
  "assets/level-1.scene",
]

# The game's effects and Dusk Road music, made in the Sindri Sound Lab
# (`tools/sindri-chiptune`). Scripts play these by name, so the manifest lists
# them; the editable `.sindrisfx` and `.sindrisong` sources sit beside their audio.
[assets]
include = [
  "audio/jump.wav",
  "audio/coin.wav",
  "audio/land.wav",
  "audio/goal.wav",
  "audio/dusk-road.ogg",
]
