<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sindri Particle Lab</title><style>html,body{margin:0;height:100%;background:#111821}canvas{width:100%;height:100%;touch-action:none;display:block}label{position:fixed;right:12px;bottom:12px;background:#d59335;color:#111;padding:10px;border-radius:6px;font:14px sans-serif;cursor:pointer}input{position:absolute;width:1px;height:1px;opacity:0}</style></head><body><canvas id="particle-lab" aria-label="Sindri Particle Lab"></canvas><label>Preview image<input id="texture-file" type="file" accept="image/png,image/jpeg"></label><script type="module">import init,{set_preview_image} from './pkg/sindri_particle_lab.js'; await init(); document.querySelector('#texture-file').addEventListener('change',async event=>{const file=event.target.files[0];if(file)set_preview_image(new Uint8Array(await file.arrayBuffer()));});</script></body></html>
