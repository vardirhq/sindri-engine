<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12161b" />
    <meta name="description" content="Bake a 3D model recipe into ordinary Sindri sprites in your browser, then download the PNG, sheet and prefab. The Sindri Sprite Baker: isometric, top-down or side view." />
    <title>Sprite Baker · Sindri Engine</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2312161b'/%3E%3Cpath d='M8 2.5 13 5.5v5L8 13.5 3 10.5v-5z M3 5.5l5 3 5-3 M8 8.5v5' fill='none' stroke='%23e9a33a' stroke-width='1.2' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1317; --panel: #151a20; --line: #262e37; --text: #dde2e7; --muted: #98a0a8;
        --forge: #e9a33a; --danger: #ef6b5b; --ok: #6fbf7b;
        --checker-a: #1b2128; --checker-b: #232a32;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--text); }
      body { font: 15px/1.5 Inter, ui-sans-serif, system-ui, sans-serif; min-height: 100dvh; }
      header {
        display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px;
        padding: 14px 16px; border-bottom: 1px solid var(--line);
        padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right));
      }
      h1 { margin: 0; font-size: 13px; letter-spacing: .08em; color: var(--forge); }
      header p { margin: 0; color: var(--muted); font-size: 14px; }
      main {
        display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 16px;
        padding: 16px; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right));
        padding-bottom: max(16px, env(safe-area-inset-bottom));
      }
      @media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); } }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
      h2 { margin: 0 0 8px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
      .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
      select, button, .button {
        font: inherit; font-size: 14px; color: var(--text); background: #1d242c; border: 1px solid var(--line);
        border-radius: 6px; padding: 6px 10px; min-height: 36px; cursor: pointer; text-decoration: none;
        display: inline-flex; align-items: center;
      }
      button:hover, .button:hover, select:hover { border-color: var(--forge); }
      button.primary, .button.primary { background: var(--forge); color: #1a1205; border-color: var(--forge); font-weight: 600; }
      textarea {
        width: 100%; height: min(62dvh, 640px); min-height: 280px; resize: vertical;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--text);
        background: #0f1317; border: 1px solid var(--line); border-radius: 6px; padding: 10px; tab-size: 2;
      }
      textarea:focus { outline: 2px solid var(--forge); outline-offset: -1px; }
      #status { min-height: 1.5em; font-size: 14px; margin: 8px 0 0; }
      #status.error { color: var(--danger); white-space: pre-wrap; }
      #status.ok { color: var(--ok); }
      .stage {
        overflow: auto; border: 1px solid var(--line); border-radius: 6px; padding: 8px; text-align: center;
        background: repeating-conic-gradient(var(--checker-a) 0 25%, var(--checker-b) 0 50%) 0 0 / 16px 16px;
      }
      .stage.stale { opacity: .45; }
      canvas { image-rendering: pixelated; max-width: none; display: inline-block; vertical-align: top; }
      dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; margin: 10px 0; font-size: 14px; }
      dt { color: var(--muted); } dd { margin: 0; font-variant-numeric: tabular-nums; }
      .swatches { display: flex; flex-wrap: wrap; gap: 4px; }
      .swatches i { width: 18px; height: 18px; border-radius: 3px; border: 1px solid #0006; display: block; }
      ul.plain { list-style: none; margin: 0; padding: 0; font-size: 14px; }
      ul.plain li { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
      ul.plain li code { flex: 1 1 14em; overflow-wrap: anywhere; }
      ul.plain li span { color: var(--muted); font-variant-numeric: tabular-nums; }
      .warn { color: var(--forge); font-size: 14px; margin: 4px 0; }
      .frames { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      noscript { display: block; padding: 16px; }
    </style>
  </head>
  <body>
    <header>
      <h1>SINDRI SPRITE BAKER</h1>
      <p>Turn a model recipe into ordinary sprites, isometric, top-down or side view: a PNG, its <code>.sheet</code> and a prefab. Nothing leaves your browser.</p>
    </header>
    <noscript>The baker needs JavaScript.</noscript>
    <main>
      <section aria-labelledby="recipe-title">
        <h2 id="recipe-title">Recipe</h2>
        <div class="bar">
          <label class="sr-only" for="example">Start from an example</label>
          <select id="example"></select>
          <label class="button">Open…<input id="open" type="file" accept=".isobake,.json,application/json" hidden /></label>
          <button id="save-recipe" type="button">Save recipe</button>
        </div>
        <label class="sr-only" for="recipe">Recipe JSON</label>
        <textarea id="recipe" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
        <p id="status" role="status"></p>
      </section>
      <section aria-labelledby="preview-title">
        <h2 id="preview-title">Baked sheet</h2>
        <div class="bar">
          <label for="zoom" class="sr-only">Zoom</label>
          <select id="zoom">
            <option value="1">1×</option><option value="2" selected>2×</option>
            <option value="3">3×</option><option value="4">4×</option>
          </select>
          <button id="download-all" class="primary" type="button" disabled>Download all (.zip)</button>
        </div>
        <div id="stage" class="stage"><canvas id="sheet" width="1" height="1" role="img" aria-label="The baked sprite sheet"></canvas></div>
        <p id="frames" class="frames"></p>
        <dl id="report"></dl>
        <div id="warnings"></div>
        <h2>Files</h2>
        <ul id="files" class="plain"></ul>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
