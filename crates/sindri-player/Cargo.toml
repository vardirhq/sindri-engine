[package]
name = "sindri-player"
description = "Plays any Sindri project: the host every browser export ships, and a native window for a project directory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Depends on the independently versioned Weave workspace.
publish = false

# `cdylib` so the player can be built for the browser, `rlib` so a game's
# own tools can reach its pieces.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
log.workspace = true
sindri = { path = "../sindri" }
sindri-assets = { path = "../sindri-assets" }
sindri-core = { path = "../sindri-core" }
sindri-decay = { path = "../sindri-decay" }
sindri-desktop = { path = "../sindri-desktop" }
sindri-platform = { path = "../sindri-platform" }
sindri-render = { path = "../sindri-render" }
sindri-runtime = { path = "../sindri-runtime" }
sindri-scene = { path = "../sindri-scene" }
thiserror.workspace = true
weave = { path = "../../weave/crates/weave" }
wgpu.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
console_log = "1"
wasm-bindgen.workspace = true

[lints]
workspace = true
